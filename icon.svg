<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#07100a"/>
  <!-- Field green accent -->
  <rect x="0" y="340" width="512" height="172" rx="0" fill="#0e1a10"/>
  <rect x="0" y="400" width="512" height="112" rx="0" fill="#0e1a10" opacity="0.6"/>
  <!-- Football -->
  <ellipse cx="256" cy="230" rx="148" ry="98" fill="#92400e"/>
  <ellipse cx="256" cy="230" rx="145" ry="95" fill="#a16207"/>
  <!-- Seam -->
  <line x1="256" y1="135" x2="256" y2="325" stroke="#fef9c3" stroke-width="7" stroke-linecap="round"/>
  <!-- Laces -->
  <line x1="222" y1="186" x2="290" y2="186" stroke="#fef9c3" stroke-width="7" stroke-linecap="round"/>
  <line x1="213" y1="216" x2="299" y2="216" stroke="#fef9c3" stroke-width="7" stroke-linecap="round"/>
  <line x1="213" y1="246" x2="299" y2="246" stroke="#fef9c3" stroke-width="7" stroke-linecap="round"/>
  <line x1="222" y1="274" x2="290" y2="274" stroke="#fef9c3" stroke-width="7" stroke-linecap="round"/>
  <!-- HQ wordmark -->
  <text x="256" y="430" font-size="96" text-anchor="middle"
    fill="#f59e0b"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"
    font-weight="900" letter-spacing="6">HQ</text>
  <!-- Tagline -->
  <text x="256" y="478" font-size="34" text-anchor="middle"
    fill="#6b8f6b"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"
    font-weight="600" letter-spacing="3">DYNASTY</text>
</svg>
