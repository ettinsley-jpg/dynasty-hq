function render() {
  document.body.dataset.facility = FACILITY.level || 0;
  const content =
    U.tab==='command'     ? renderCommandCenter() :
    U.tab==='myteam'      ? renderMyTeam()        :
    U.tab==='gmboard'     ? renderGMBoard()       :
    U.tab==='tradefinder' ? renderTradeFinder()   :
    U.tab==='intel'       ? renderIntel()         :
                            renderImport();

  document.getElementById('root').innerHTML = renderNav() + content + renderModal();

  if (U.modal === 'addplayer') {
    setTimeout(() => { const el=document.getElementById('ap-name'); if(el) el.focus(); }, 20);
  }
}

// ══════════════════════════════════════════════════
//  DRAG AND DROP
// ══════════════════════════════════════════════════

let drag = null;

document.addEventListener('dragstart', e => {
  const row = e.target.closest('[data-pr]');
  if (!row) return;
  drag = {key:row.dataset.key, tid:row.dataset.tid, pos:row.dataset.pos, idx:parseInt(row.dataset.idx)};
  setTimeout(() => row.classList.add('dragging'), 0);
});
document.addEventListener('dragover', e => {
  const row = e.target.closest('[data-pr]');
  if (!row || !drag || row.dataset.key !== drag.key) return;
  e.preventDefault();
  document.querySelectorAll('[data-pr].drag-over').forEach(el => el.classList.remove('drag-over'));
  row.classList.add('drag-over');
});
document.addEventListener('dragleave', e => {
  const row = e.target.closest('[data-pr]');
  if (row) row.classList.remove('drag-over');
});
document.addEventListener('drop', e => {
  e.preventDefault();
  const row = e.target.closest('[data-pr]');
  if (!row || !drag || row.dataset.key !== drag.key) { drag=null; return; }
  const toIdx = parseInt(row.dataset.idx);
  if (toIdx !== drag.idx) {
    const arr = getRanked(drag.tid, drag.pos);
    const copy = [...arr];
    const [moved] = copy.splice(drag.idx, 1);
    copy.splice(toIdx, 0, moved);
    saveRanking(drag.tid, drag.pos, copy.map(p => p.id));
  }
  drag = null; render();
});
document.addEventListener('dragend', () => {
  document.querySelectorAll('[data-pr].dragging,[data-pr].drag-over').forEach(el => {
    el.classList.remove('dragging','drag-over');
  });
  drag = null;
});

// ══════════════════════════════════════════════════
//  CLICK & CHANGE DELEGATION
// ══════════════════════════════════════════════════

document.addEventListener('click', e => {
  if (e.target && e.target.id === 'modal-overlay') { U.modal=null; render(); return; }
  if (e.target && e.target.id === 'hire-modal-overlay') { U.showHireModal=false; render(); return; }

  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;

  switch(act) {
    case 'tab':
      U.tab = btn.dataset.val; render(); break;

    case 'cc-switch-league':
      switchLeague(btn.dataset.lid);
      U.tab = 'command'; render(); break;

    case 'open-hire-modal':
    case 'hire-staff':
      U.showHireModal = true;
      U.hireRole = btn.dataset.role || STAFF_ROLES[0].id;
      render(); break;

    case 'close-hire-modal':
      U.showHireModal = false; render(); break;

    case 'hire-role-tab':
      U.hireRole = btn.dataset.val; render(); break;

    case 'hire-confirm': {
      const role = btn.dataset.role;
      const cid  = btn.dataset.cid;
      const pool = getCandidatePool(role);
      const candidate = pool.find(c => c.id === cid);
      if (!candidate) break;
      if (!STAFF.hired) STAFF.hired = {};
      STAFF.hired[role] = candidate;
      saveStaff();
      U.showHireModal = false;
      render(); break;
    }

    case 'dismiss-alert': {
      const aid = btn.dataset.aid;
      STAFF.deskAlerts = (STAFF.deskAlerts || []).filter(a => a.id !== aid);
      saveStaff(); render(); break;
    }

    case 'intel-type':
      INTEL.intelType = btn.dataset.val;
      INTEL.ecrLoaded = false;
      render(); break;

    case 'intel-scoring':
      INTEL.intelScoring = btn.dataset.val;
      INTEL.ecrLoaded = false; INTEL.projLoaded = false;
      render(); break;

    case 'intel-load':
      loadECR();
      loadProjections();
      if (ODDS_API_KEY) loadOdds();
      break;

    case 'load-odds':
      loadOdds(); break;

    case 'save-odds-key': {
      const keyEl = document.getElementById('odds-key-input');
      const key = keyEl ? keyEl.value.trim() : '';
      ODDS_API_KEY = key;
      localStorage.setItem(ODDS_KEY_STORAGE, key);
      INTEL.oddsError = null; INTEL.oddsLoaded = false;
      render(); break;
    }

    case 'superflex':
      if (!S.settings) S.settings = {};
      S.settings.superflex = !S.settings.superflex;
      if (FB_URL) fbPut('settings/superflex', S.settings.superflex);
      saveS(); render(); break;

    case 'idpflex':
      if (!S.settings) S.settings = {};
      S.settings.idpFlex = !S.settings.idpFlex;
      if (FB_URL) fbPut('settings/idpFlex', S.settings.idpFlex);
      saveS(); render(); break;

    case 'mv': {
      const {tid,pos} = btn.dataset;
      const i = parseInt(btn.dataset.idx), d = parseInt(btn.dataset.dir);
      const copy = [...getRanked(tid,pos)];
      const j = i+d;
      if (j>=0 && j<copy.length) { [copy[i],copy[j]]=[copy[j],copy[i]]; saveRanking(tid,pos,copy.map(p=>p.id)); render(); }
      break;
    }

    case 'del-player': {
      const {tid,pid} = btn.dataset;
      const team = S.teams.find(t=>t.id===tid);
      if (team) {
        team.players=team.players.filter(p=>p.id!==pid);
        if (FB_URL) fbPut('teams/'+tid, team);
        saveS(); render();
      }
      break;
    }

    case 'assess': {
      const {tid,pos,slot,val} = btn.dataset;
      setAssessment(tid, pos, slot, val);
      render(); break;
    }

    case 'open-add':
      U.modal='addplayer'; U.addForTeam=btn.dataset.tid; render(); break;

    case 'close-modal':
      U.modal=null; render(); break;

    case 'submit-add':
      submitAddPlayer(); break;

    case 'set-my-team': {
      const tid = btn.dataset.tid;
      claimTeam(tid);
      U.tab='myteam'; render(); break;
    }

    case 'fb-connect': {
      const urlEl = document.getElementById('fb-url-input');
      const url = urlEl && urlEl.value.trim();
      if (!url || !url.startsWith('https://')) {
        U.importStatus = {type:'error', msg:'Please enter a valid Firebase URL starting with https://'};
        render(); break;
      }
      U.importStatus = null;
      connectFirebase(url);
      render(); break;
    }

    case 'fb-disconnect':
      disconnectFirebase();
      U.importStatus = {type:'info', msg:'Disconnected from Firebase. Data is now local only.'};
      render(); break;

    case 'fb-copy-url': {
      // Copy just the Firebase URL — for manual sharing when running locally
      if (!FB_URL) break;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(FB_URL).then(() => {
          U.importStatus = {type:'success', msg:'✅ Firebase URL copied! Paste it in a message to your league. They open the app, go to ⚙️ Setup, and paste it to connect.'};
          render();
        }).catch(() => prompt('Copy this Firebase URL and send it to your league:', FB_URL));
      } else {
        prompt('Copy this Firebase URL and send it to your league:', FB_URL);
      }
      break;
    }

    case 'fb-copy-join': {
      const shareUrl = leagueShareUrl();
      if (!shareUrl) break;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareUrl).then(() => {
          U.importStatus = {type:'success', msg:'✅ Join link copied! Share it with your league. When they open it, they\'ll connect automatically.'};
          render();
        }).catch(() => prompt('Copy this link and share with your league:', shareUrl));
      } else {
        prompt('Copy this link and share with your league:', shareUrl);
      }
      break;
    }

    case 'toggle-add-team':
      U.showAddTeam=!U.showAddTeam; render(); break;

    case 'add-team':
      addTeamManual(); break;

    case 'sleeper-lookup':
      doSleeperLookup(); break;

    case 'sleeper-select-all':
      if (U.sleeperFoundLeagues) {
        U.sleeperSelectedIds = new Set(U.sleeperFoundLeagues.map(l=>l.league_id));
        render();
      }
      break;

    case 'sleeper-deselect-all':
      U.sleeperSelectedIds = new Set();
      render();
      break;

    case 'sleeper-import-selected':
      doSleeperImportSelected(); break;

    case 'sleeper-import':
      doSleeperImport(); break;

    case 'reset':
      if (confirm('Reset this league? Clears local teams and rankings for the current league (does not affect Firebase).')) {
        const resetState = emptyLeagueState();
        S = resetState;
        MY_TEAM_ID = null;
        saveLeagues();
        U = {tab:'setup',gmTeam:null,tradeTeam:null,modal:null,addForTeam:null,
             importStatus:null,importing:false,importProgress:'',showAddTeam:false,showFbSetup:false};
        syncSelectors(); render();
      }
      break;

    case 'switch-league-btn':
      if (el.dataset.val) switchLeague(el.dataset.val);
      break;

    case 'add-league': {
      const nameEl = document.getElementById('new-league-name');
      const name = (nameEl ? nameEl.value.trim() : '') || 'New League';
      addLeague(name);
      break;
    }

    case 'delete-league':
      if (LEAGUES.length <= 1) { alert('You need at least one league.'); break; }
      if (confirm(`Delete "${(_curLeague()||{}).name}"? This cannot be undone.`)) {
        disconnectFirebase(true);
        LEAGUES = LEAGUES.filter(l => l.id !== CURRENT_LEAGUE_ID);
        localStorage.setItem(LEAGUES_KEY, JSON.stringify(LEAGUES));
        CURRENT_LEAGUE_ID = null;
        switchLeague(LEAGUES[0].id);
      }
      break;

    case 'rename-league': {
      const el = document.getElementById('league-name-input');
      const name = el ? el.value.trim() : '';
      if (name) {
        const idx = LEAGUES.findIndex(l => l.id === CURRENT_LEAGUE_ID);
        if (idx >= 0) { LEAGUES[idx].name = name; saveLeagues(); render(); }
      }
      break;
    }
  }
});

document.addEventListener('change', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.dataset.act==='toggle-league-sel') {
    if (!U.sleeperSelectedIds) U.sleeperSelectedIds = new Set();
    const lid = el.dataset.lid;
    if (el.checked) U.sleeperSelectedIds.add(lid); else U.sleeperSelectedIds.delete(lid);
    render(); return;
  }
  if (el.dataset.act==='switch-league') { switchLeague(el.value); return; }
  if (el.dataset.act==='gm-team')    { U.gmTeam=el.value;    render(); }
  if (el.dataset.act==='trade-team') { U.tradeTeam=el.value; render(); }
  if (el.dataset.act==='intel-week') {
    INTEL.intelWeek = parseInt(el.value);
    INTEL.projLoaded = false;
    render();
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'intel-search') {
    U.intelSearch = e.target.value;
    render();
  }
});

document.addEventListener('keydown', e => {
  if (e.key==='Escape' && U.modal) { U.modal=null; render(); return; }
  if (e.key==='Enter') {
    const id = document.activeElement && document.activeElement.id;
    if ((id==='ap-name'||id==='ap-age') && U.modal==='addplayer') { submitAddPlayer(); return; }
    if (id==='sleeper-username' && !U.sleeperLookingUp) { doSleeperLookup(); return; }
    if (id==='sleeper-lid' && !U.importing) { doSleeperImport(); return; }
    if (id==='add-team-name') { addTeamManual(); return; }
    if (id==='fb-url-input') {
      const url = document.getElementById('fb-url-input').value.trim();
      if (url.startsWith('https://')) { U.importStatus=null; connectFirebase(url); render(); }
      return;
    }
  }
});

function submitAddPlayer() {
  const name = (document.getElementById('ap-name')||{}).value;
  const pos  = (document.getElementById('ap-pos') ||{}).value;
  const age  = parseInt((document.getElementById('ap-age')||{}).value)||0;
  if (!name||!name.trim()||!pos) return;
  const team = S.teams.find(t=>t.id===U.addForTeam);
  if (!team) return;
  team.players.push({id:'mp_'+Date.now(), name:name.trim(), pos, age, rank:9999});
  if (FB_URL) fbPut('teams/'+team.id, team);
  saveS(); U.modal=null; render();
}

function addTeamManual() {
  const el = document.getElementById('add-team-name');
  const name = el && el.value.trim();
  if (!name) return;
  const t = {id:'mt_'+Date.now(), name, isMyTeam:false, players:[]};
  S.teams.push(t);
  if (FB_URL) fbPut('teams/'+t.id, t);
  saveS(); U.showAddTeam=false; render();
}

// ── Sleeper username lookup ──────────────────────────────────────────────────
async function doSleeperLookup() {
  const usernameEl = document.getElementById('sleeper-username');
  const username = usernameEl && usernameEl.value.trim();
  if (!username) { U.importStatus={type:'error',msg:'Enter your Sleeper username first.'}; render(); return; }

  U.sleeperLookingUp = true; U.importStatus = null; U.sleeperFoundLeagues = null; U.sleeperSelectedIds = null; render();

  try {
    const uRes = await fetch(`https://api.sleeper.app/v1/user/${encodeURIComponent(username)}`);
    if (!uRes.ok) throw new Error('Sleeper user not found. Check your username.');
    const user = await uRes.json();
    if (!user || !user.user_id) throw new Error('Sleeper user not found.');

    const season = new Date().getFullYear().toString();
    const lRes = await fetch(`https://api.sleeper.app/v1/user/${user.user_id}/leagues/nfl/${season}`);
    if (!lRes.ok) throw new Error('Could not load leagues.');
    const leagues = await lRes.json();

    if (!leagues || leagues.length === 0) {
      U.importStatus = {type:'error', msg:`No leagues found for "${username}" in ${season}.`};
      U.sleeperLookingUp = false; render(); return;
    }

    U.sleeperUserId = user.user_id;
    U.sleeperFoundLeagues = leagues.map(l => ({
      league_id: l.league_id,
      name: l.name || 'Unnamed League',
      season: l.season,
      total_rosters: l.total_rosters,
      roster_positions: l.roster_positions || [],
    }));
    U.sleeperSelectedIds = new Set(U.sleeperFoundLeagues.map(l => l.league_id));
  } catch(err) {
    U.importStatus = {type:'error', msg: err.message || 'Lookup failed.'};
  }

  U.sleeperLookingUp = false; render();
}

// ── Import all selected leagues ──────────────────────────────────────────────
async function doSleeperImportSelected() {
  if (!U.sleeperFoundLeagues || !U.sleeperSelectedIds || U.sleeperSelectedIds.size === 0) return;

  const toImport = U.sleeperFoundLeagues.filter(l => U.sleeperSelectedIds.has(l.league_id));
  U.importing = true; U.importStatus = null; render();

  // Load player DB once
  U.importProgress = 'Loading player database…'; render();
  let allP = null;
  try {
    const c = localStorage.getItem('sl_players_v2');
    if (c) { const {ts,data}=JSON.parse(c); if (Date.now()-ts<86400000) allP=data; }
  } catch(e) {}
  if (!allP) {
    const pRes = await fetch('https://api.sleeper.app/v1/players/nfl');
    allP = await pRes.json();
    try { localStorage.setItem('sl_players_v2', JSON.stringify({ts:Date.now(),data:allP})); } catch(e) {}
  }

  let imported = 0;
  for (const lg of toImport) {
    U.importProgress = `Importing "${lg.name}" (${imported+1}/${toImport.length})…`; render();
    try {
      const [rRes, uRes] = await Promise.all([
        fetch(`https://api.sleeper.app/v1/league/${lg.league_id}/rosters`),
        fetch(`https://api.sleeper.app/v1/league/${lg.league_id}/users`),
      ]);
      const rosters = await rRes.json();
      const users   = await uRes.json();

      const userMap = {};
      users.forEach(u => { userMap[u.user_id] = (u.metadata&&u.metadata.team_name)||u.display_name||'Team'; });

      const sfx   = lg.roster_positions.includes('SUPER_FLEX');
      const isIDP = lg.roster_positions.some(p => IDP_POSITIONS.includes(p) || p==='IDP_FLEX');
      const idpFlx= lg.roster_positions.includes('IDP_FLEX');

      const newTeams = rosters.map((r,idx) => {
        const name = userMap[r.owner_id]||('Team '+(idx+1));
        const owners = [r.owner_id, ...(r.co_owners||[])].filter(Boolean);
        const isMyTeam = !!(U.sleeperUserId && owners.includes(U.sleeperUserId));
        const pids = [...new Set([...(r.players||[]), ...(r.reserve||[]), ...(r.taxi||[])])];
        const seenNames = new Set();
        const players = pids.map(pid => {
          const p = allP[pid];
          if (!p) return null;
          const rawPos    = (p.fantasy_positions&&p.fantasy_positions[0])||p.position||'';
          const mappedPos = IDP_POS_MAP[rawPos]||IDP_POS_MAP[p.position]||rawPos;
          if (!POSITIONS.includes(mappedPos)) return null;
          const name = p.full_name||pid;
          if (seenNames.has(name)) return null;
          seenNames.add(name);
          return {id:'sl_'+pid, name, pos:mappedPos, age:p.age||0, rank:p.search_rank||9999};
        }).filter(Boolean);
        players.sort((a,b) => a.rank - b.rank);
        return {id:'sl_'+r.roster_id, name, isMyTeam, players};
      });

      const myTeam = newTeams.find(t => t.isMyTeam);

      // Find or create the LEAGUES entry for this league
      let existingIdx = LEAGUES.findIndex(l => l.sleeperLeagueId === lg.league_id);
      if (existingIdx < 0) {
        const newId = 'lg_' + Math.random().toString(36).slice(2,9);
        LEAGUES.push({ id: newId, name: lg.name, sleeperLeagueId: lg.league_id, fbUrl: null, myTeamId: null, ...emptyLeagueState() });
        existingIdx = LEAGUES.length - 1;
      }
      const leagueState = { ...emptyLeagueState(),
        teams: newTeams,
        settings: {superflex:!!sfx, idpFlex:!!idpFlx, isIDP:!!isIDP},
        myTeamId: myTeam ? myTeam.id : null,
      };
      LEAGUES[existingIdx] = { ...LEAGUES[existingIdx], ...leagueState, myTeamId: myTeam ? myTeam.id : null };
      imported++;
    } catch(e) {
      console.warn('Failed to import league', lg.league_id, e);
    }
  }

  localStorage.setItem(LEAGUES_KEY, JSON.stringify(LEAGUES));
  // Switch to the first imported league
  const firstImported = LEAGUES.find(l => toImport.some(t => t.league_id === l.sleeperLeagueId));
  if (firstImported) switchLeague(firstImported.id);

  U.importing = false; U.importProgress = '';
  U.importStatus = {type:'success', msg:`✅ Imported ${imported} league${imported!==1?'s':''}. Click "This Is My Team" below to claim your roster.`};
  render();
}

// ── Legacy single league ID import ──────────────────────────────────────────
async function doSleeperImport() {
  const lidEl = document.getElementById('sleeper-lid');
  const lid   = lidEl && lidEl.value.trim();
  if (!lid) { U.importStatus={type:'error',msg:'Please enter a Sleeper league ID.'}; render(); return; }

  U.importing=true; U.importStatus={type:'info',msg:'Connecting…'}; U.importProgress='Fetching league info…'; render();

  try {
    const lRes = await fetch('https://api.sleeper.app/v1/league/'+lid);
    if (!lRes.ok) throw new Error('League not found. Double-check your league ID.');
    const league = await lRes.json();

    const rosterPos = league.roster_positions || [];
    // Auto-detect superflex
    const sfx    = rosterPos.includes('SUPER_FLEX');
    // Auto-detect IDP league and IDP_FLEX
    const isIDP  = rosterPos.some(p => IDP_POSITIONS.includes(p) || p === 'IDP_FLEX');
    const idpFlx = rosterPos.includes('IDP_FLEX');
    if (!S.settings) S.settings = {};
    S.settings.superflex = !!sfx;
    S.settings.idpFlex   = !!idpFlx;
    S.settings.isIDP     = !!isIDP;

    U.importProgress='Fetching rosters &amp; users…'; render();
    const [rRes, uRes] = await Promise.all([
      fetch('https://api.sleeper.app/v1/league/'+lid+'/rosters'),
      fetch('https://api.sleeper.app/v1/league/'+lid+'/users'),
    ]);
    const rosters = await rRes.json();
    const users   = await uRes.json();

    U.importProgress='Loading player database (~5 sec)…'; render();
    let allP = null;
    try {
      const c = localStorage.getItem('sl_players_v2');
      if (c) { const {ts,data}=JSON.parse(c); if (Date.now()-ts<86400000) allP=data; }
    } catch(e) {}
    if (!allP) {
      const pRes = await fetch('https://api.sleeper.app/v1/players/nfl');
      allP = await pRes.json();
      try { localStorage.setItem('sl_players_v2', JSON.stringify({ts:Date.now(),data:allP})); } catch(e) {}
    }

    U.importProgress='Building teams…'; render();
    const userMap = {};
    users.forEach(u => { userMap[u.user_id]=(u.metadata&&u.metadata.team_name)||u.display_name||'Team'; });

    const newTeams = rosters.map((r,idx) => {
      const name = userMap[r.owner_id]||('Team '+(idx+1));
      const pids = (r.players||[]).concat(r.reserve||[]);
      const players = pids.map(pid => {
        const p = allP[pid];
        if (!p) return null;
        // Resolve position: use fantasy_positions[0] first, then fall back to position field
        const rawPos   = (p.fantasy_positions && p.fantasy_positions[0]) || p.position || '';
        const mappedPos = IDP_POS_MAP[rawPos] || IDP_POS_MAP[p.position] || rawPos;
        if (!POSITIONS.includes(mappedPos)) return null;
        return {id:'sl_'+pid, name:p.full_name||pid, pos:mappedPos, age:p.age||0, rank:p.search_rank||9999};
      }).filter(Boolean);
      return {id:'sl_'+r.roster_id, name, isMyTeam:false, players};
    });

    const sfxNote  = sfx    ? ' Superflex on.' : '';
    const idpNote  = isIDP  ? ' IDP league detected (DL/LB/DB).' : '';
    const flxNote  = idpFlx ? ' IDP_FLEX on — LB has 2 starter slots.' : '';
    S.settings = {superflex:!!sfx, idpFlex:!!idpFlx, isIDP:!!isIDP};
    S.teams = newTeams;
    S.myRankings = {};
    S.myAssessment = {};

    // If Firebase is connected, push all teams and settings to the shared DB
    // so every league member gets the rosters without re-importing
    if (FB_URL) {
      U.importProgress = 'Syncing to Firebase…'; render();
      const teamsObj = {};
      newTeams.forEach(t => { teamsObj[t.id] = t; });
      await fbPut('teams', teamsObj);
      await fbPut('settings', S.settings);
    }

    MY_TEAM_ID = null;
    saveLeagues(); syncSelectors();
    U.importing=false; U.importProgress='';
    U.importStatus={type:'success',msg:`✅ Imported ${newTeams.length} teams from "${league.name}".${sfxNote}${idpNote}${flxNote}${FB_URL ? ' Teams synced to Firebase.' : ''} Click "This Is My Team" below.`};
    render();

  } catch(err) {
    U.importing=false; U.importProgress='';
    U.importStatus={type:'error',msg:err.message||'Import failed. Check your league ID.'};
    render();
  }
}

// Deterministic persona seed from a string
function djb2(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h) ^ str.charCodeAt(i);
  return Math.abs(h);
}

function generateCandidate(role, seed) {
  const h = djb2(role + seed);
  const pick = (arr, n) => arr[(h * (n+1) * 31337) % arr.length | 0];
  const firstName = pick(STAFF_FIRST, 0);
  const lastName  = pick(STAFF_LAST, 1);
  const trait     = pick(STAFF_TRAITS[role], 2);
  const tag       = (STAFF_TAGS[role] || STAFF_TAGS.gm)[(h * 7 % (STAFF_TAGS[role]||STAFF_TAGS.gm).length) | 0];
  const avatarSeed = `${firstName}${lastName}${seed}`.toLowerCase().replace(/\s/g,'');
  return { id: `${role}_${seed}`, role, firstName, lastName, trait, tag, avatarSeed };
}

function getCandidatePool(role) {
  // Use a daily-rotating seed so pool refreshes each day but is consistent within a day
  const daySeed = Math.floor(Date.now() / 86400000);
  return [0,1,2,3].map(i => generateCandidate(role, `${daySeed}_${i}`));
}

function avatarUrl(seed, style='lorelei') {
  return `https://api.dicebear.com/9.x/${style}/svg?seed=${encodeURIComponent(seed)}&backgroundColor=0d1220&radius=50`;
}

function renderCommandCenter() {
  const lvl = FACILITY.level || 0;
  const facilityNames = ['Broom Closet','Startup Office','Mid-Market HQ','Major Market','Dynasty HQ','The Empire'];
  const bgClass = `facility-${Math.min(lvl, 5)}`;

  // Multi-league overview cards
  const leagueCards = LEAGUES.map(l => {
    const myTeam = (l.teams||[]).find(t => t.isMyTeam || t.id === l.myTeamId);
    const isActive = l.id === CURRENT_LEAGUE_ID;
    return `<div class="lo-card${isActive?' lo-card-active':''}" data-act="cc-switch-league" data-lid="${esc(l.id)}">
      ${l.fbUrl ? '<div class="lo-card-sync" title="Live sync active"></div>' : ''}
      <div class="lo-card-name">${esc(l.name)}</div>
      <div class="lo-card-team">${myTeam ? esc(myTeam.name) : '<span style="color:var(--muted)">No team</span>'}</div>
      <div class="lo-card-meta">${(l.teams||[]).length} teams · ${(myTeam&&myTeam.players||[]).length} players</div>
    </div>`;
  }).join('');

  const addLeagueCard = `<div class="lo-card" data-act="tab" data-val="import" style="border-style:dashed;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80px;gap:6px">
    <div style="font-size:20px">+</div>
    <div style="font-size:12px;color:var(--muted)">Add League</div>
  </div>`;

  // Staff desk — Marge always present, then hired staff cards
  const hasTeams = LEAGUES.some(l => (l.teams||[]).length > 0);
  const bubbleMsg = hasTeams
    ? "Honey, your leagues are loaded. Now hire a GM so he can actually do something useful."
    : "Honey, you can't run a franchise with no players. Click that note to get started.";

  const hired = STAFF.hired || {};
  const staffCards = STAFF_ROLES.map(role => {
    const hire = hired[role.id];
    if (hire) {
      const totalXp = Object.values((STAFF.xp||{})[role.id] || {}).reduce((s,v)=>s+v,0);
      const xpPct = Math.min(100, (totalXp / 100) * 100);
      return `<div class="staff-card" data-act="open-hire-modal" title="Click to manage staff">
        <div class="staff-card-avatar">
          <img src="${avatarUrl(hire.avatarSeed)}" alt="" loading="lazy" onerror="this.style.display='none'">
        </div>
        <div class="staff-card-body">
          <div class="staff-card-name">${esc(hire.firstName)} ${esc(hire.lastName)}</div>
          <div class="staff-card-role">${role.emoji} ${role.label}</div>
          <div class="staff-card-trait">${esc(hire.trait)}</div>
          <div class="staff-card-xp">
            <div class="xp-bar"><div class="xp-fill" style="width:${xpPct}%"></div></div>
            <div class="xp-label">${totalXp} XP</div>
          </div>
        </div>
      </div>`;
    }
    return `<div class="staff-add-slot" data-act="open-hire-modal" data-role="${role.id}">
      <div style="font-size:22px">${role.emoji}</div>
      <div>Hire ${role.label}</div>
    </div>`;
  }).join('');

  const assistant = ASSISTANTS[Math.min(lvl, ASSISTANTS.length - 1)];
  const assistantSVG = getAssistantSVG(lvl);

  const deskContent = `
    <div class="marge-wrap" style="margin-bottom:16px">
      ${assistantSVG}
      <div class="marge-bubble">
        <div class="bubble-name">${assistant.name} · ${assistant.title}</div>
        <div class="bubble-text">${bubbleMsg}</div>
      </div>
      ${!hasTeams ? `<div class="sticky-note-wrap">
        <div class="sticky-note" data-act="tab" data-val="import">📝 Add Your Team</div>
      </div>` : ''}
    </div>
    <div class="staff-cards">${staffCards}</div>`;

  const modal = U.showHireModal ? renderHiringModal() : '';

  return `<div class="cc-page">
    <div class="cc-facility ${bgClass}">
      <div class="cc-header">
        <div>
          <div class="cc-title">🏟️ Your Franchise</div>
          <div class="cc-facility-badge">${facilityNames[lvl] || 'Unknown'}</div>
        </div>
        <button class="btn btn-outline btn-sm" data-act="open-hire-modal" style="font-size:11px">🏢 Manage Staff</button>
      </div>

      <div class="cc-section-label">Your Leagues</div>
      <div class="lo-grid">${leagueCards}${addLeagueCard}</div>

      <div class="cc-section-label">Front Office</div>
      <div class="staff-desk">${deskContent}</div>
    </div>
  </div>${modal}`;
}

// Background Firebase sync — loads user data from Firebase, updates app state
// Uses optimistic pattern: show localStorage data immediately, sync in background
async function initFirebaseSync() {
  try {
    const [fbLeagues, fbFacility, fbStaff] = await Promise.all([
      userGet('leagues'),
      userGet('facility'),
      userGet('staff'),
    ]);

    let changed = false;

    if (fbLeagues) {
      const arr = Array.isArray(fbLeagues) ? fbLeagues : Object.values(fbLeagues);
      if (arr.length > 0) {
        LEAGUES = arr;
        // Re-sync current league state
        const league = LEAGUES.find(l => l.id === CURRENT_LEAGUE_ID) || LEAGUES[0];
        if (league) {
          CURRENT_LEAGUE_ID = league.id;
          S.teams         = league.teams         || S.teams;
          S.gmRankings    = league.gmRankings    || S.gmRankings;
          S.gmAssessments = league.gmAssessments || S.gmAssessments;
          S.settings      = league.settings      || S.settings;
          S.myRankings    = league.myRankings    || S.myRankings;
          S.myAssessment  = league.myAssessment  || S.myAssessment;
          FB_URL          = league.fbUrl         || FB_URL;
          MY_TEAM_ID      = league.myTeamId      || MY_TEAM_ID;
        }
        changed = true;
      }
    } else {
      // No Firebase data yet — migrate from localStorage
      const localRaw = localStorage.getItem(LEAGUES_KEY);
      if (localRaw) {
        const localLeagues = JSON.parse(localRaw);
        if (localLeagues && localLeagues.length) {
          userPut('leagues', localLeagues); // migrate
          // localStorage cleanup happens naturally as saves go to Firebase
        }
      }
    }

    if (fbFacility) { FACILITY = fbFacility; changed = true; }
    if (fbStaff)    { STAFF    = fbStaff;    changed = true; }

    if (changed) { syncSelectors(); if (!FB_CONNECTED) render(); }
  } catch(e) { console.warn('Firebase user sync failed:', e); }
}

initFirebaseSync();
