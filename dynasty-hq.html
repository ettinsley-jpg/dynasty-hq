<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynasty HQ 🏈</title>
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#f59e0b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dynasty HQ">
  <link rel="apple-touch-icon" href="/icon.svg">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#080c14;--bg2:#0d1220;--bg3:#111827;--card:#111827;
      --border:#1e2d45;--gbright:#22c55e;--gold:#f59e0b;--gold-dk:#5c3a05;
      --text:#e2e8f0;--muted:#64748b;--red:#ef4444;--blue:#60a5fa;
      --purple:#a78bfa;--teal:#2dd4bf;
    }
    body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}

    /* Nav */
    .nav{background:rgba(8,12,20,.95);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
    .nav-inner{max-width:1100px;margin:0 auto;display:flex;align-items:stretch;overflow-x:auto}
    .nav-logo{padding:13px 18px;font-weight:900;font-size:18px;color:var(--gold);white-space:nowrap;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
    .nav-logo span{color:var(--gbright)}
    .nav-tab{padding:13px 15px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:none;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;transition:.15s;letter-spacing:.02em}
    .nav-tab:hover{color:var(--text)}
    .nav-tab.active{color:var(--gold);border-bottom-color:var(--gold)}

    /* Layout */
    .page{max-width:1100px;margin:0 auto;padding:24px 18px}
    .page-hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:12px;flex-wrap:wrap}
    .page-title{font-size:24px;font-weight:800;margin-bottom:3px;letter-spacing:-.5px}
    .page-sub{color:var(--muted);font-size:13px}

    /* Cards */
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.4)}
    .card-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px}
    .card-title{font-weight:700;font-size:15px;letter-spacing:.01em}

    /* Position badges */
    .pb{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:800;letter-spacing:.05em;flex-shrink:0}
    .pb-QB{background:#1e3a8a;color:#93c5fd}
    .pb-RB{background:#14532d;color:#86efac}
    .pb-WR{background:#3b0764;color:#d8b4fe}
    .pb-TE{background:#7c2d12;color:#fdba74}
    .pb-K{background:#292524;color:#d6d3d1}
    .pb-DEF{background:#1e1b4b;color:#a5b4fc}
    .pb-DL{background:#3b1f00;color:#fb923c}
    .pb-LB{background:#0f2d2d;color:#2dd4bf}
    .pb-DB{background:#1a1030;color:#c084fc}

    /* Slot labels */
    .sl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:2px 6px;border-radius:3px}
    .sl-starter{background:var(--gold);color:#000}
    .sl-backup{background:#374151;color:#9ca3af}
    .sl-deep{background:#1f2937;color:#6b7280}

    /* Player avatar initials */
    .pr-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;letter-spacing:.02em;border:2px solid transparent}
    .pr-avatar-QB{background:#1e3a8a;color:#93c5fd;border-color:#1d4ed8}
    .pr-avatar-RB{background:#14532d;color:#86efac;border-color:#15803d}
    .pr-avatar-WR{background:#3b0764;color:#d8b4fe;border-color:#7c3aed}
    .pr-avatar-TE{background:#7c2d12;color:#fdba74;border-color:#c2410c}
    .pr-avatar-K{background:#292524;color:#d6d3d1;border-color:#57534e}
    .pr-avatar-DEF{background:#1e1b4b;color:#a5b4fc;border-color:#4338ca}
    .pr-avatar-DL{background:#3b1f00;color:#fb923c;border-color:#c2410c}
    .pr-avatar-LB{background:#0f2d2d;color:#2dd4bf;border-color:#0f766e}
    .pr-avatar-DB{background:#1a1030;color:#c084fc;border-color:#7c3aed}

    /* Player rows */
    .pr{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;margin-bottom:5px;cursor:grab;user-select:none;transition:.15s}
    .pr:hover{border-color:#2a3d5a;background:#161e2e}
    .pr.drag-over{border-color:var(--gold);background:#1e1800}
    .pr.dragging{opacity:.3}
    .pr-rank{font-size:12px;font-weight:800;color:var(--muted);min-width:20px;text-align:center}
    .pr-grip{color:var(--muted);font-size:16px;flex-shrink:0;opacity:.5}
    .pr-info{flex:1;min-width:0}
    .pr-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
    .pr-meta{font-size:11px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .pr-right{display:flex;gap:5px;align-items:center;flex-shrink:0}
    .mv{display:flex;flex-direction:column;gap:2px}
    .mv-btn{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:4px;padding:2px 6px;font-size:11px;cursor:pointer;line-height:1.4;transition:.1s}
    .mv-btn:hover{background:var(--bg2);color:var(--text);border-color:var(--muted)}
    .mv-btn:disabled{opacity:.2;cursor:default;pointer-events:none}

    /* Separator */
    .sep{border-top:1px dashed var(--border);margin:4px 0 6px;position:relative}
    .sep-lbl{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--bg3);padding:0 8px;font-size:10px;color:var(--muted);font-weight:600;white-space:nowrap}

    /* Buttons */
    .btn{padding:7px 14px;border-radius:6px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
    .btn:disabled{opacity:.5;cursor:default}
    .btn-gold{background:var(--gold);color:#000}
    .btn-gold:hover:not(:disabled){background:#d97706}
    .btn-outline{background:transparent;border:1px solid var(--border);color:var(--muted)}
    .btn-outline:hover{border-color:var(--muted);color:var(--text)}
    .btn-danger{background:transparent;border:1px solid #7f1d1d;color:#f87171}
    .btn-danger:hover{background:#7f1d1d}
    .btn-green{background:#1a5c1a;color:var(--gbright);border:1px solid var(--gbright)}
    .btn-green:hover{background:#1c3d1c}
    .btn-sm{padding:4px 10px;font-size:12px}

    /* Assessment buttons */
    .assess-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px dashed var(--border)}
    .assess-lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;min-width:52px}
    .abtn{padding:3px 9px;border-radius:4px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--muted);transition:.15s;white-space:nowrap}
    .abtn:hover{color:var(--text);border-color:var(--muted)}
    .abtn.as{background:#14342a;border-color:var(--gbright);color:var(--gbright)}  /* active strength */
    .abtn.an{background:#1f2937;border-color:#4b5563;color:#9ca3af}               /* active neutral */
    .abtn.ane{background:#3b0f0f;border-color:var(--red);color:#f87171}           /* active need */
    .assess-sep{width:1px;height:16px;background:var(--border);flex-shrink:0;margin:0 2px}

    /* Assessment tags (mini badges shown on card header) */
    .atag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;border:1px solid;white-space:nowrap}
    .atag-strength{background:#14342a;border-color:var(--gbright);color:var(--gbright)}
    .atag-need{background:#3b0f0f;border-color:var(--red);color:#f87171}
    .atag-neutral{background:#1f2937;border-color:#4b5563;color:#9ca3af}

    /* Superflex toggle */
    .sfx-toggle{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer;padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--muted);transition:.15s;user-select:none}
    .sfx-toggle:hover{border-color:var(--muted);color:var(--text)}
    .sfx-toggle.on{border-color:var(--gold);color:var(--gold);background:#1e1800}
    .sfx-toggle input{width:14px;height:14px;accent-color:var(--gold);cursor:pointer}

    /* Forms */
    select,input[type=text],input[type=number]{background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 12px;font-size:14px;width:100%}
    select:focus,input:focus{outline:none;border-color:var(--gold)}
    select option{background:var(--bg3)}
    label{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
    .fg{margin-bottom:14px}
    .frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}

    /* Modal */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
    .modal{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:420px}
    .modal-title{font-size:18px;font-weight:800;margin-bottom:20px}
    .modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

    /* Mismatch analysis rows */
    .mm-section{margin-bottom:24px}
    .mm-section-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);margin-bottom:10px}
    .mm-section-title{font-size:14px;font-weight:700;color:var(--text)}
    .mm-count{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--bg3);color:var(--muted);border:1px solid var(--border)}
    .mm-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;transition:.15s}
    .mm-item.hot{border-color:var(--gold)}
    .mm-item.chip-match{border-color:#3b82f6}
    .mm-body{flex:1;min-width:0}
    .mm-name{font-weight:600;font-size:14px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mm-ranks{font-size:12px;color:var(--muted)}
    .mm-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
    .mm-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px;border:1px solid}
    .mm-tag-gold{background:#1e1800;border-color:var(--gold);color:var(--gold)}
    .mm-tag-green{background:#14342a;border-color:var(--gbright);color:var(--gbright)}
    .mm-tag-blue{background:#1e3a5f;border-color:#3b82f6;color:#93c5fd}
    .mm-tag-red{background:#3b0f0f;border-color:var(--red);color:#fca5a5}
    .mm-tag-gray{background:#1f2937;border-color:#4b5563;color:#9ca3af}
    .mm-gap{font-size:18px;font-weight:900;color:var(--gold);min-width:36px;text-align:right;flex-shrink:0;line-height:1.4}
    .mm-gap.neutral{color:var(--muted);font-size:14px}
    .mm-empty{color:var(--muted);font-size:13px;padding:16px 0;text-align:center}

    /* Context panel */
    .ctx-panel{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:18px}
    .ctx-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
    .ctx-row:last-child{margin-bottom:0}
    .ctx-label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;min-width:68px}
    .vgap{display:inline-block;padding:3px 10px;border-radius:4px;font-size:12px;font-weight:700;background:var(--gold-dk);color:var(--gold)}

    /* Alerts */
    .alert{padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:14px;line-height:1.5}
    .alert-info{background:#1e3a5f;border:1px solid #2563eb;color:#93c5fd}
    .alert-success{background:#14342a;border:1px solid #16a34a;color:#86efac}
    .alert-error{background:#3b0f0f;border:1px solid #dc2626;color:#fca5a5}

    /* Spinner */
    .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle;flex-shrink:0}
    @keyframes sp{to{transform:rotate(360deg)}}

    /* Empty */
    .empty{text-align:center;padding:48px 20px;color:var(--muted)}
    .empty-ico{font-size:44px;margin-bottom:12px}

    /* Misc */
    .divider{border-top:1px solid var(--border);margin:20px 0}
    .tlr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
    .tlr:last-child{border-bottom:none}
    .badge-my{background:var(--gold-dk);color:var(--gold);font-size:10px;font-weight:800;padding:2px 7px;border-radius:4px;text-transform:uppercase;margin-left:8px}
    .chip{display:inline-flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--muted)}

    @media(max-width:640px){
      .frow{grid-template-columns:1fr}
      .nav-tab{padding:12px 9px;font-size:11px}
      .page{padding:14px 10px}
      .assess-row{gap:4px}
      .abtn{padding:3px 7px;font-size:10px}
    }

    /* ── Command Center ─────────────────────────────── */
    .cc-page{max-width:1100px;margin:0 auto;padding:20px 18px}

    /* Facility backgrounds */
    .facility-0{background:radial-gradient(ellipse at 30% 20%,#2a1a08 0%,#0d0a06 60%,#080604 100%);border-radius:16px;padding:24px;min-height:70vh;position:relative;overflow:hidden;box-shadow:inset 0 0 80px rgba(0,0,0,.6)}
    .facility-0::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 48px,rgba(255,255,255,.015) 48px,rgba(255,255,255,.015) 49px),repeating-linear-gradient(90deg,transparent,transparent 48px,rgba(255,255,255,.015) 48px,rgba(255,255,255,.015) 49px);pointer-events:none}
    .facility-1{background:radial-gradient(ellipse at 50% 0%,#0f1a2e 0%,#080c14 70%);border-radius:16px;padding:24px;min-height:70vh}
    .facility-2{background:radial-gradient(ellipse at 60% 10%,#0a1628 0%,#060a10 70%);border-radius:16px;padding:24px;min-height:70vh}

    .cc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px}
    .cc-title{font-size:22px;font-weight:900;color:var(--gold);letter-spacing:-.5px}
    .cc-facility-badge{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:4px 12px;margin-top:4px}

    .cc-section-label{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;margin-top:20px}

    /* League overview cards */
    .lo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:4px}
    .lo-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px 16px;cursor:pointer;transition:.15s;position:relative}
    .lo-card:hover{border-color:var(--gold);background:rgba(245,158,11,.06);transform:translateY(-1px)}
    .lo-card-active{border-color:var(--gold)!important;background:rgba(245,158,11,.08)!important}
    .lo-card-name{font-weight:700;font-size:13px;color:var(--text);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .lo-card-team{font-size:12px;color:var(--muted);margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .lo-card-meta{font-size:11px;color:var(--muted)}
    .lo-card-sync{position:absolute;top:10px;right:10px;width:7px;height:7px;border-radius:50%;background:#22c55e}

    /* Staff desk */
    .staff-desk{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:20px;margin-top:4px;min-height:140px}

    /* Marge */
    .marge-wrap{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
    .marge-char{position:relative;display:flex;flex-direction:column;align-items:center;flex-shrink:0}
    .marge-emoji{font-size:54px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
    .marge-smoke{position:absolute;bottom:0;right:-4px;font-size:18px;animation:smoke 3s ease-in-out infinite}
    @keyframes smoke{0%,100%{opacity:.6;transform:translateY(0) rotate(-5deg)}50%{opacity:1;transform:translateY(-4px) rotate(5deg)}}
    .marge-bubble{background:#f5ead4;color:#2d1f0a;border-radius:14px 14px 14px 0;padding:12px 16px;max-width:320px;box-shadow:0 2px 12px rgba(0,0,0,.4);position:relative}
    .marge-bubble::before{content:'';position:absolute;bottom:-8px;left:0;width:0;height:0;border-top:8px solid #f5ead4;border-right:12px solid transparent}
    .bubble-name{font-size:10px;font-weight:800;color:#8b6914;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
    .bubble-text{font-size:13px;line-height:1.5;font-style:italic}

    /* Sticky note */
    .sticky-note-wrap{display:flex;align-items:flex-end;padding-bottom:8px}
    .sticky-note{background:#fef08a;color:#422;border-radius:3px;padding:12px 16px;font-size:12px;font-weight:700;cursor:pointer;transform:rotate(-3deg);display:inline-block;box-shadow:3px 3px 8px rgba(0,0,0,.4),inset 0 -2px 4px rgba(0,0,0,.1);transition:.2s;line-height:1.4}
    .sticky-note:hover{transform:rotate(0deg) scale(1.04);box-shadow:4px 4px 12px rgba(0,0,0,.5)}

    /* Alert cards on desk */
    .desk-alert{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start}
    .desk-alert-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;background:rgba(255,255,255,.08)}
    .desk-alert-body{flex:1;min-width:0}
    .desk-alert-from{font-size:11px;font-weight:700;color:var(--gold);margin-bottom:4px}
    .desk-alert-msg{font-size:13px;color:var(--text);line-height:1.45}
    .desk-alert-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  </style>
</head>
<body>
<div id="root"></div>
<script>
'use strict';

// ══════════════════════════════════════════════════
//  CONSTANTS
// ══════════════════════════════════════════════════

const POSITIONS     = ['QB','RB','WR','TE','K','DEF','DL','LB','DB'];
const OFF_POSITIONS = ['QB','RB','WR','TE','K','DEF'];  // non-IDP
const IDP_POSITIONS = ['DL','LB','DB'];

const LEAGUES_KEY = 'dynastyHQ_leagues_v1';
const CURRENT_LEAGUE_KEY = 'dynastyHQ_currentLeague';

// App-level Firebase — stores user-private data (leagues, staff, facility)
const APP_FB_URL = 'https://dynasty-hq-664f5-default-rtdb.firebaseio.com';

function getUid() {
  let uid = localStorage.getItem('dynastyHQ_uid');
  if (!uid) {
    uid = 'u_' + Math.random().toString(36).slice(2,11) + Date.now().toString(36);
    localStorage.setItem('dynastyHQ_uid', uid);
  }
  return uid;
}
const UID = getUid();

async function userGet(path) {
  try {
    const res = await fetch(`${APP_FB_URL}/users/${UID}/${path}.json`);
    return res.ok ? res.json() : null;
  } catch(e) { return null; }
}
async function userPut(path, data) {
  try {
    await fetch(`${APP_FB_URL}/users/${UID}/${path}.json`, {
      method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)
    });
  } catch(e) {}
}

// Base slots — QB adjusted for superflex, IDP positions adjusted for IDP_FLEX
const BASE_SLOTS = {
  QB:{s:1,b:1}, RB:{s:2,b:2}, WR:{s:2,b:2},
  TE:{s:1,b:1}, K:{s:1,b:0}, DEF:{s:1,b:0},
  DL:{s:1,b:2}, LB:{s:1,b:2}, DB:{s:1,b:2},
};

// Sleeper position → app IDP position (DE/DT → DL, CB/S/FS/SS → DB)
const IDP_POS_MAP = {
  DL:'DL', DE:'DL', DT:'DL', NT:'DL', NG:'DL',
  LB:'LB', ILB:'LB', OLB:'LB', MLB:'LB',
  DB:'DB', CB:'DB', S:'DB', SS:'DB', FS:'DB', SAF:'DB',
};

function getPosSlots(pos) {
  const v = BASE_SLOTS[pos] || {s:1,b:1};
  if (pos === 'QB' && S.settings && S.settings.superflex) return {s:2, b:v.b};
  // IDP_FLEX adds 1 extra starter slot — distributed to LB (most common IDP position)
  if (pos === 'LB' && S.settings && S.settings.idpFlex) return {s:2, b:v.b};
  return v;
}

function slotInfo(idx, pos) {
  const v = getPosSlots(pos);
  if (idx < v.s)       return {text:'Starter',    cls:'sl-starter'};
  if (idx < v.s + v.b) return {text:'Backup',     cls:'sl-backup'};
  return                      {text:'Deep Bench',  cls:'sl-deep'};
}

  // Migration: convert old single-league data if it exists
  const oldData = (() => { try { const x = localStorage.getItem('dynastyHQ_v5'); return x ? JSON.parse(x) : null; } catch(e){ return null; } })();

function currentNFLWeek() {
  // NFL season starts first Thursday of September
  // Returns 1-18; off-season returns 0
  const now = new Date();
  const year = now.getFullYear();
  const sep1 = new Date(year, 8, 1);
  const daysTillThurs = (4 - sep1.getDay() + 7) % 7;
  const kickoff = new Date(year, 8, 1 + daysTillThurs);
  const ms = now - kickoff;
  if (ms < 0) return 1;
  const week = Math.floor(ms / (7 * 24 * 60 * 60 * 1000)) + 1;
  return Math.min(Math.max(week, 1), 18);
}

function resolveSleeperPlayer(pid) {
  try {
    const raw = localStorage.getItem('sl_players_v2');
    if (!raw) return null;

    return db[pid] || null;

async function loadECR() {
  if (INTEL.ecrLoading) return;
  INTEL.ecrLoading = true; INTEL.ecrError = null; render();
  try {
    // Primary: FantasyPros ECR from Netlify serverless function
    const ecrRes = await fetch(`/.netlify/functions/ecr?type=${INTEL.intelType}&scoring=${INTEL.intelScoring}`);
    if (!ecrRes.ok) throw new Error(`ECR service returned ${ecrRes.status}`);
    const ecrData = await ecrRes.json();
    if (ecrData.error) throw new Error(ecrData.error);
    if (!Array.isArray(ecrData) || !ecrData.length) throw new Error('No ECR data returned');

    // Secondary: Sleeper trending for add/drop signal (best-effort)
    const addMap = {}, dropMap = {};
    try {
      const [addRes, dropRes] = await Promise.all([
        fetch(`https://api.sleeper.app/v1/players/nfl/trending/add?lookback_hours=24&limit=200`),
        fetch(`https://api.sleeper.app/v1/players/nfl/trending/drop?lookback_hours=24&limit=200`),
      ]);
      if (addRes.ok) {
        const adds = await addRes.json();
        adds.forEach(d => {
          const p = resolveSleeperPlayer(d.player_id);
          if (p) addMap[normalizeName(`${p.first_name||''} ${p.last_name||''}`)] = d.count;
        });
      }
      if (dropRes.ok) {
        const drops = await dropRes.json();
        drops.forEach(d => {
          const p = resolveSleeperPlayer(d.player_id);
          if (p) dropMap[normalizeName(`${p.first_name||''} ${p.last_name||''}`)] = d.count;
        });
      }
    } catch(e) { /* trending is optional */ }

    INTEL.ecr = {};
    ecrData.forEach(p => {
      const key = normalizeName(p.name);
      INTEL.ecr[key] = {
        fpRank: p.rank,
        rankBest: p.rankBest,
        rankWorst: p.rankWorst,
        uncertainty: p.uncertainty,
        name: p.name,
        team: p.team,
        pos: p.pos,
        pid: null,
        addCount: addMap[key] || 0,
        dropCount: dropMap[key] || 0,
      };
    });
    INTEL.ecrLoaded = true;
  } catch(e) { INTEL.ecrError = e.message; }
  INTEL.ecrLoading = false; render();
}

async function loadProjections() {
  if (INTEL.projLoading) return;
  INTEL.projLoading = true; INTEL.projError = null; render();
  try {
    const year = new Date().getFullYear();
    const positions = ['QB','RB','WR','TE','K','DEF','DL','LB','DB'];
    const posQ = positions.map(p => 'position[]=' + p).join('&');
    const url = `https://api.sleeper.app/v1/projections/nfl/${year}/${INTEL.intelWeek}?season_type=regular&${posQ}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`Sleeper returned ${res.status}`);
    const raw = await res.json();

    INTEL.projections = {};
    let count = 0;
    for (const [pid, stats] of Object.entries(raw || {})) {
      if (!stats) continue;
      const ppr = stats.pts_ppr ?? stats.pts_half_ppr ?? stats.pts_std ?? null;
      if (ppr === null) continue;
      INTEL.projections[pid] = { ppr, half_ppr: stats.pts_half_ppr ?? null, std: stats.pts_std ?? null };
      count++;
    }

    if (count === 0) {
      // Off-season — projections not published yet
      INTEL.projError = 'OFF_SEASON';
    } else {
      INTEL.projLoaded = true;
    }
  } catch(e) { INTEL.projError = e.message; }
  INTEL.projLoading = false; render();
}

async function loadOdds() {
  if (!ODDS_API_KEY) {
    INTEL.oddsError = 'NO_KEY';
    INTEL.oddsLoading = false; render(); return;
  }
  if (INTEL.oddsLoading) return;
  INTEL.oddsLoading = true; INTEL.oddsError = null; render();
  try {
    // The Odds API supports CORS — can be called directly from the browser
    const markets = 'offensive_rookie_of_the_year,offensive_player_of_the_year,mvp';
    const url = `https://api.the-odds-api.com/v4/sports/americanfootball_nfl/odds` +
      `?apiKey=${ODDS_API_KEY}&regions=us&markets=${markets}&oddsFormat=american`;
    const res = await fetch(url);
    if (res.status === 401) throw new Error('INVALID_KEY');
    if (!res.ok) throw new Error(`Odds API returned ${res.status}`);
    const events = await res.json();

    INTEL.odds = [];
    for (const event of events || []) {
      for (const bm of event.bookmakers || []) {
        for (const mkt of bm.markets || []) {
          for (const outcome of mkt.outcomes || []) {
            INTEL.odds.push({
              market: mkt.key, player: outcome.name,
              price: outcome.price, bookmaker: bm.key,
            });
          }
        }
      }
    }
    INTEL.oddsLoaded = true;
  } catch(e) { INTEL.oddsError = e.message; }
  INTEL.oddsLoading = false; render();
}

function normalizeName(name) {
  return (name || '').toLowerCase()
    .replace(/[^a-z0-9 ]/g, '')
    .replace(/\s+/g, ' ')

//  FIREBASE — REST + Server-Sent Events (no SDK needed)
// ══════════════════════════════════════════════════

async function connectFirebase(url) {
  if (FB_SOURCE) { FB_SOURCE.close(); FB_SOURCE = null; }
  if (FB_PENDING_RETRY) { clearTimeout(FB_PENDING_RETRY); FB_PENDING_RETRY = null; }

  FB_URL = url.trim().replace(/\/$/, '');
  FB_CONNECTED = false;

  // ── Step 1: test the connection with a plain fetch before opening SSE ──
  // This gives us a real HTTP error code instead of a silent spin.
  try {
    const test = await fetch(FB_URL + '/dynastyhq.json?shallow=true&t=' + Date.now());
    if (test.status === 401 || test.status === 403) {
      FB_URL = null;
      U.importStatus = {type:'error', msg:
        '🔒 Firebase refused the connection (permission denied).\n\n' +
        'Fix: In Firebase console → Realtime Database → Rules tab, replace the rules with:\n' +
        '{\n  "rules": {\n    ".read": true,\n    ".write": true\n  }\n}\n' +
        'Then click Publish and try connecting again.'};
      render(); return;
    }
    if (!test.ok && test.status !== 404) {
      FB_URL = null;
      U.importStatus = {type:'error', msg:`Firebase returned error ${test.status}. Double-check your database URL.`};
      render(); return;
    }
  } catch(e) {
    FB_URL = null;
    U.importStatus = {type:'error', msg:
      'Could not reach Firebase. Possible causes:\n' +
      '• Database URL is wrong (should look like https://your-project-default-rtdb.firebaseio.com)\n' +
      '• No internet connection\n' +
      '• The Realtime Database was not created (check Firebase console → Build → Realtime Database)'};
    render(); return;
  }

  // Test passed — save URL and open SSE stream
  saveLeagues();
  render(); // show "Connecting…" dot while SSE handshakes

  try {
    FB_SOURCE = new EventSource(FB_URL + '/dynastyhq.json');
  } catch(e) {
    FB_URL = null; saveLeagues();
    U.importStatus = {type:'error', msg:'EventSource failed — check your browser and database URL.'};
    render(); return;
  }

  // Timeout: if no event in 12 s, the SSE handshake is stuck
  const connTimeout = setTimeout(() => {
    if (!FB_CONNECTED) {
      U.importStatus = {type:'error', msg:
        'Firebase connected but sent no data. This usually means the database URL is correct ' +
        'but the Realtime Database service is not enabled. ' +
        'Go to Firebase console → Build → Realtime Database → Create database.'};
      disconnectFirebase();
      render();
    }
  }, 12000);

  FB_SOURCE.addEventListener('put', e => {
    clearTimeout(connTimeout);
    try {
      const {path, data} = JSON.parse(e.data);
      applyFbEvent(path, data);
      FB_CONNECTED = true;
      U.importStatus = null; // clear any prior error
      saveLocal(); syncSelectors(); render();
    } catch(err) { console.warn('FB put parse error', err); }
  });

  FB_SOURCE.addEventListener('patch', e => {
    clearTimeout(connTimeout);
    try {
      const {path, data} = JSON.parse(e.data);
      if (path === '/' && data) {
        Object.entries(data).forEach(([k, v]) => applyFbEvent('/' + k, v));
      } else {
        applyFbEvent(path, data);
      }
      FB_CONNECTED = true;
      saveLocal(); syncSelectors(); render();
    } catch(err) { console.warn('FB patch parse error', err); }
  });

  FB_SOURCE.onerror = () => {
    // Don't immediately show error if we were already connected — SSE auto-reconnects
    if (FB_CONNECTED) {
      FB_CONNECTED = false;
      render(); // show amber dot during reconnect
    }
    // SSE will retry on its own; also schedule our own retry for hard failures
    if (FB_PENDING_RETRY) clearTimeout(FB_PENDING_RETRY);
    FB_PENDING_RETRY = setTimeout(() => {
      if (FB_URL && !FB_CONNECTED) connectFirebase(FB_URL);
    }, 10000);
  };
}

function applyFbEvent(path, data) {
  // path is relative to /dynastyhq/ root
  const parts = path.split('/').filter(Boolean);

  if (parts.length === 0) {
    // Full snapshot
    if (!data) return;
    FB_LIVE = {
      teams:          data.teams          || {},
      selfRankings:   data.selfRankings   || {},
      selfAssessments:data.selfAssessments|| {},
      settings:       data.settings       || {},
    };
    // Populate S from Firebase
    rebuildSFromFB();
    return;
  }

  const root = parts[0];
  if (root === 'teams') {
    if (parts.length === 1) {
      FB_LIVE.teams = data || {};
    } else {
      if (data === null) delete FB_LIVE.teams[parts[1]];
      else FB_LIVE.teams[parts[1]] = data;
    }
    rebuildTeamsFromFB();
  } else if (root === 'settings') {
    if (parts.length === 1) FB_LIVE.settings = data || {};
    else FB_LIVE.settings[parts[1]] = data;
    S.settings = Object.assign({superflex:false}, FB_LIVE.settings);
  } else if (root === 'selfRankings') {
    if (!FB_LIVE.selfRankings) FB_LIVE.selfRankings = {};
    if (parts.length === 1) {
      FB_LIVE.selfRankings = data || {};
    } else if (parts.length === 2) {
      if (data === null) delete FB_LIVE.selfRankings[parts[1]];
      else FB_LIVE.selfRankings[parts[1]] = data;
    } else if (parts.length === 3) {
      if (!FB_LIVE.selfRankings[parts[1]]) FB_LIVE.selfRankings[parts[1]] = {};
      FB_LIVE.selfRankings[parts[1]][parts[2]] = data;
    }
    // If it's my own rankings coming back, sync into S.myRankings
    if (MY_TEAM_ID) {
      if (parts.length >= 2 && parts[1] === MY_TEAM_ID) {
        if (parts.length === 2) S.myRankings = data || {};
        else if (parts.length === 3) { if (!S.myRankings) S.myRankings={}; S.myRankings[parts[2]] = data; }
      }
    }
  } else if (root === 'selfAssessments') {
    if (!FB_LIVE.selfAssessments) FB_LIVE.selfAssessments = {};
    if (parts.length === 1) {
      FB_LIVE.selfAssessments = data || {};
    } else if (parts.length === 2) {
      if (data === null) delete FB_LIVE.selfAssessments[parts[1]];
      else FB_LIVE.selfAssessments[parts[1]] = data;
    } else {
      if (!FB_LIVE.selfAssessments[parts[1]]) FB_LIVE.selfAssessments[parts[1]] = {};
      FB_LIVE.selfAssessments[parts[1]][parts[2]] = data;
    }
    // Sync my assessment
    if (MY_TEAM_ID && parts.length >= 2 && parts[1] === MY_TEAM_ID) {
      S.myAssessment = (FB_LIVE.selfAssessments[MY_TEAM_ID]) || {};
    }
  }
}

function rebuildSFromFB() {
  rebuildTeamsFromFB();
  S.settings = Object.assign({superflex:false}, FB_LIVE.settings);
  if (MY_TEAM_ID && FB_LIVE.selfRankings[MY_TEAM_ID]) {
    S.myRankings = FB_LIVE.selfRankings[MY_TEAM_ID];
  }
  if (MY_TEAM_ID && FB_LIVE.selfAssessments[MY_TEAM_ID]) {
    S.myAssessment = FB_LIVE.selfAssessments[MY_TEAM_ID];
  }
}

function rebuildTeamsFromFB() {
  if (!Object.keys(FB_LIVE.teams).length) return;
  S.teams = Object.values(FB_LIVE.teams).map(t => ({
    ...t,
    isMyTeam: t.id === MY_TEAM_ID,
  }));
}

async function fbPut(path, data) {
  if (!FB_URL) return;
  try {
    await fetch(`${FB_URL}/dynastyhq/${path}.json`, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(data),
    });
  } catch(e) { console.warn('FB write error:', e); }
}

function disconnectFirebase(silent) {
  if (FB_SOURCE) { FB_SOURCE.close(); FB_SOURCE = null; }
  if (FB_PENDING_RETRY) { clearTimeout(FB_PENDING_RETRY); FB_PENDING_RETRY = null; }
  FB_URL = null;
  FB_CONNECTED = false;
  FB_LIVE = { teams:{}, selfRankings:{}, selfAssessments:{}, settings:{} };
  if (!silent) { saveLeagues(); render(); }
}

function isLocalFile() {
  return window.location.protocol === 'file:' || window.location.origin === 'null';
}

function leagueShareUrl(customAppUrl) {
  if (!FB_URL) return null;
  const base = customAppUrl
    ? customAppUrl.trim().replace(/\/?$/, '')
    : isLocalFile() ? null : (window.location.origin + window.location.pathname.replace(/\/$/, ''));
  if (!base) return null;
  // Make sure it ends with the html filename
  const path = base.endsWith('.html') ? base : base + '/dynasty-hq.html';
  return path + '#fb=' + encodeURIComponent(FB_URL);
}

function claimTeam(teamId) {
  MY_TEAM_ID = teamId;
  S.teams.forEach(t => t.isMyTeam = t.id === teamId);
  // Push existing rankings and assessment to Firebase under this teamId
  if (FB_URL) {
    Object.entries(S.myRankings || {}).forEach(([pos, ids]) => {
      fbPut('selfRankings/' + teamId + '/' + pos, ids);
    });
    if (Object.keys(S.myAssessment || {}).length) {
      fbPut('selfAssessments/' + teamId, S.myAssessment);
    }
  }
  saveLocal();
  syncSelectors();
}

// saveS = alias for saveLocal
function saveS() { saveLocal(); }

function syncSelectors() {
  const others = S.teams.filter(t => !t.isMyTeam);
  if (others.length) {
    if (!U.gmTeam    || !others.find(t => t.id === U.gmTeam))    U.gmTeam    = others[0].id;
    if (!U.tradeTeam || !others.find(t => t.id === U.tradeTeam)) U.tradeTeam = others[0].id;
  } else { U.gmTeam = null; U.tradeTeam = null; }
}

function getRanked(teamId, pos) {
  const team = S.teams.find(t => t.id === teamId);
  if (!team) return [];
  const pp = team.players.filter(p => p.pos === pos);
  const order = team.isMyTeam
    ? (S.myRankings[pos] || [])
    : ((S.gmRankings[teamId] || {})[pos] || []);
  if (!order.length) return [...pp].sort((a,b) => (a.rank||9999)-(b.rank||9999));
  const out = [];
  for (const id of order) { const p = pp.find(x => x.id===id); if (p) out.push(p); }
  for (const p of pp)     { if (!out.find(x => x.id===p.id)) out.push(p); }
  return out;
}

function saveRanking(teamId, pos, ids) {
  const team = S.teams.find(t => t.id === teamId);
  if (!team) return;
  if (team.isMyTeam) {
    if (!S.myRankings) S.myRankings = {};
    S.myRankings[pos] = ids;
    // Write to Firebase so everyone sees it
    if (FB_URL && MY_TEAM_ID) fbPut('selfRankings/' + MY_TEAM_ID + '/' + pos, ids);
  } else {
    if (!S.gmRankings[teamId]) S.gmRankings[teamId] = {};
    S.gmRankings[teamId][pos] = ids;
  }
  saveLocal();
}

function getAssessment(teamId) {
  const team = S.teams.find(t => t.id === teamId);
  if (!team) return {};
  return team.isMyTeam ? (S.myAssessment || {}) : ((S.gmAssessments || {})[teamId] || {});
}

function setAssessment(teamId, pos, slot, val) {
  const team = S.teams.find(t => t.id === teamId);
  if (!team) return;
  const current = getAssessment(teamId);
  if (!current[pos]) current[pos] = {};
  current[pos][slot] = current[pos][slot] === val ? null : val;
  if (team.isMyTeam) {
    S.myAssessment = current;
    // Write assessment to Firebase so trade partners see your position tags
    if (FB_URL && MY_TEAM_ID) fbPut('selfAssessments/' + MY_TEAM_ID, current);
  } else {
    if (!S.gmAssessments) S.gmAssessments = {};
    S.gmAssessments[teamId] = current;
  }
  saveLocal();
}

// Their actual self-ranking (from Firebase) — used in Trade Intelligence
function getTheirLiveRanking(teamId, pos) {
  return (FB_LIVE.selfRankings[teamId] || {})[pos] || null;
}

// Their actual assessment (from Firebase) if available, else my GM assessment
function getTheirLiveAssessment(teamId) {
  const live = FB_LIVE.selfAssessments[teamId];
  if (live && Object.keys(live).length) return live;
  return (S.gmAssessments || {})[teamId] || {};
}

// ══════════════════════════════════════════════════
//  TRADE INTELLIGENCE — ranking gap analysis
// ══════════════════════════════════════════════════

function analyzeOpportunities(myId, theirId) {
  const myTeam    = S.teams.find(t => t.id === myId);
  const theirTeam = S.teams.find(t => t.id === theirId);
  if (!myTeam || !theirTeam) return {buySignals:[], chips:[], hasGMData:false, hasLiveRanks:false};

  const myAssess = getAssessment(myId);

  // Check if we have their LIVE Firebase rankings (the real data)
  const liveRankings   = FB_LIVE.selfRankings[theirId]   || {};
  const hasLiveRanks   = Object.keys(liveRankings).some(p => (liveRankings[p]||[]).length > 0);

  // Their assessment: use Firebase live assessment if available, else my GM assessment
  const theirAssess = getTheirLiveAssessment(theirId);

  // hasGMData = I've ranked their players in GM Board (my scouting notes)
  const gmData    = S.gmRankings[theirId] || {};
  const hasGMData = hasLiveRanks || Object.keys(gmData).some(pos => (gmData[pos]||[]).length > 0);

  // ── Buy signals: their players I rank higher than they rank themselves ──
  const buySignals = [];
  POSITIONS.forEach(pos => {
    const ownerOrder = theirTeam.players.filter(p => p.pos === pos);
    if (!ownerOrder.length) return;
    const gmOrder = getRanked(theirId, pos); // MY opinion of their players
    const slots   = getPosSlots(pos);

    // Their ranking: live Firebase self-ranking (real) or roster order (estimate)
    const livePosOrder = liveRankings[pos] || [];
    const useLive = livePosOrder.length > 0;

    gmOrder.forEach((pl, myRank) => {
      const ownerRank = useLive
        ? livePosOrder.indexOf(pl.id)
        : ownerOrder.findIndex(p => p.id === pl.id);
      if (ownerRank < 0) return;
      const gap = ownerRank - myRank; // positive = I value them more
      if (gap < 1) return;

      const myNeed    = myAssess[pos]    || {};
      const theirPos  = theirAssess[pos] || {};
      const isStarter = myRank < slots.s;

      const tags = [];
      // My need context
      if (isStarter && myNeed.starters === 'need')
        tags.push({cls:'mm-tag-red', text:'⚠️ Your starter need'});
      else if (!isStarter && myNeed.depth === 'need')
        tags.push({cls:'mm-tag-red', text:'⚠️ Your depth need'});
      else if (isStarter && myNeed.starters === 'strength')
        tags.push({cls:'mm-tag-gray', text:'You have starter depth here'});
      // Their willingness to sell context
      if (theirPos.starters === 'strength')
        tags.push({cls:'mm-tag-green', text:'💪 They have starter surplus'});
      if (theirPos.depth === 'strength')
        tags.push({cls:'mm-tag-green', text:'💪 They have depth surplus'});
      if (theirPos.starters === 'need' || theirPos.depth === 'need')
        tags.push({cls:'mm-tag-gray', text:'They need '+pos+' — less likely to sell'});

      buySignals.push({pl, pos, myRank, ownerRank, gap, slots, tags, isStarter});
    });
  });
  buySignals.sort((a, b) => b.gap - a.gap);

  // ── Trade chips: my players that align with their needs or my surplus ──
  const chips = [];
  POSITIONS.forEach(pos => {
    const myPlayers = getRanked(myId, pos);
    const slots     = getPosSlots(pos);
    const myPos     = myAssess[pos]    || {};
    const theirPos  = theirAssess[pos] || {};

    myPlayers.forEach((pl, rank) => {
      if (rank === 0) return; // Never flag your #1 at any position

      const isStarter   = rank < slots.s;
      const myStrength  = myPos.starters === 'strength' || myPos.depth === 'strength';
      const theirNeed   = theirPos.starters === 'need'  || theirPos.depth === 'need';
      const si          = slotInfo(rank, pos);

      // Only surface as a chip if: I have surplus here OR they have a need here
      if (!myStrength && !theirNeed) return;

      const tags = [];
      if (myPos.depth === 'strength' || (!isStarter && myPos.starters === 'strength'))
        tags.push({cls:'mm-tag-green', text:'💪 Your surplus'});
      if (myPos.starters === 'strength' && isStarter)
        tags.push({cls:'mm-tag-green', text:'💪 Starter depth'});
      if (theirPos.starters === 'need' && isStarter)
        tags.push({cls:'mm-tag-blue',  text:'📥 They need '+pos+' starters'});
      if (theirPos.depth === 'need' && !isStarter)
        tags.push({cls:'mm-tag-blue',  text:'📥 They need '+pos+' depth'});
      if (myPos.starters === 'need' && isStarter)
        tags.push({cls:'mm-tag-red',   text:'⚠️ You also need starters here'});

      const matchesTheirNeed = theirNeed;
      chips.push({pl, pos, rank, slots, si, tags, matchesTheirNeed});
    });
  });
  // Sort: matches their need first, then by rank (lower = better player)
  chips.sort((a, b) => {
    if (a.matchesTheirNeed !== b.matchesTheirNeed) return b.matchesTheirNeed - a.matchesTheirNeed;
    return a.rank - b.rank;
  });

  return {buySignals, chips, hasGMData, hasLiveRanks, myAssess, theirAssess};
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function rosterSummaryCard(team) {
  const assess = getAssessment(team.id);
  const posList = ['QB','RB','WR','TE'];
  const players = team.players || [];
  const totalPlayers = players.length;
  const avgAge = players.filter(p=>p.age>0).length
    ? (players.filter(p=>p.age>0).reduce((s,p)=>s+p.age,0) / players.filter(p=>p.age>0).length).toFixed(1)
    : '—';

  const posCards = posList.map(pos => {
    const posPlayers = players.filter(p => p.pos === pos);
    const slots = getPosSlots(pos);
    const starters = posPlayers.slice(0, slots.s);
    const pa = assess[pos] || {};
    const starterGrade = pa.starters;
    const depthGrade = pa.depth;
    const gradeColor = g => g === 'strength' ? '#22c55e' : g === 'need' ? '#ef4444' : '#64748b';
    const gradeIcon  = g => g === 'strength' ? '💪' : g === 'need' ? '⚠️' : '—';

    return `<div style="flex:1;min-width:100px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <span class="pb pb-${pos}">${pos}</span>
        <span style="font-size:11px;color:var(--muted)">${posPlayers.length}p</span>
      </div>
      <div style="font-size:12px;margin-bottom:4px">
        <span style="color:var(--muted)">Start: </span>
        <span style="color:${gradeColor(starterGrade)};font-weight:700">${gradeIcon(starterGrade)} ${starterGrade||'Unrated'}</span>
      </div>
      <div style="font-size:12px">
        <span style="color:var(--muted)">Depth: </span>
        <span style="color:${gradeColor(depthGrade)};font-weight:700">${gradeIcon(depthGrade)} ${depthGrade||'Unrated'}</span>
      </div>
    </div>`;
  }).join('');

  return `<div class="card" style="margin-bottom:20px;background:linear-gradient(135deg,#111827 0%,#0d1520 100%)">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <div>
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px">Roster Overview</div>
        <div style="font-size:20px;font-weight:800">${esc(team.name)}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:24px;font-weight:900;color:var(--gold)">${totalPlayers}</div>
        <div style="font-size:11px;color:var(--muted)">players</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">${posCards}</div>
    <div style="display:flex;gap:16px;font-size:12px;color:var(--muted);border-top:1px solid var(--border);padding-top:10px">
      <span>Avg Age: <strong style="color:var(--text)">${avgAge}</strong></span>
      <span>QBs: <strong style="color:var(--text)">${players.filter(p=>p.pos==='QB').length}</strong></span>
      <span>RBs: <strong style="color:var(--text)">${players.filter(p=>p.pos==='RB').length}</strong></span>
      <span>WRs: <strong style="color:var(--text)">${players.filter(p=>p.pos==='WR').length}</strong></span>
      <span>TEs: <strong style="color:var(--text)">${players.filter(p=>p.pos==='TE').length}</strong></span>
    </div>
  </div>`;
}

function playerRow(pl, idx, total, teamId, pos, canDelete) {
  const key = esc(teamId + '_' + pos);
  const si  = slotInfo(idx, pos);
  const meta = pl.age > 0 ? 'Age ' + pl.age : 'Team DEF';
  return `
    <div class="pr" draggable="true"
      data-pr="1" data-key="${key}"
      data-tid="${esc(teamId)}" data-pos="${esc(pos)}" data-idx="${idx}">
      <span class="pr-rank">${idx+1}</span>
      <div class="pr-avatar pr-avatar-${esc(pos)}">${pl.name.split(' ').map(w=>w[0]||'').slice(0,2).join('').toUpperCase()}</div>
      <div class="pr-info">
        <div class="pr-name">${esc(pl.name)}</div>
        <div class="pr-meta">${meta} · <span class="sl ${si.cls}">${si.text}</span></div>
      </div>
      <div class="pr-right">
        <div class="mv">
          <button class="mv-btn" data-act="mv" data-tid="${esc(teamId)}" data-pos="${esc(pos)}" data-idx="${idx}" data-dir="-1" ${idx===0?'disabled':''}>▲</button>
          <button class="mv-btn" data-act="mv" data-tid="${esc(teamId)}" data-pos="${esc(pos)}" data-idx="${idx}" data-dir="1"  ${idx===total-1?'disabled':''}>▼</button>
        </div>
        ${canDelete ? `<button class="btn btn-danger btn-sm" data-act="del-player" data-tid="${esc(teamId)}" data-pid="${esc(pl.id)}">✕</button>` : ''}
      </div>
    </div>`;
}

function assessmentRow(teamId, pos) {
  const assess  = getAssessment(teamId);
  const posA    = assess[pos] || {};
  const slots   = getPosSlots(pos);
  const hasDepth = slots.b > 0;

  function aBtns(slot, current) {
    return [
      {val:'strength', lbl:'💪 Strength', cls:'as'},
      {val:'neutral',  lbl:'— Neutral',  cls:'an'},
      {val:'need',     lbl:'⚠️ Need',    cls:'ane'},
    ].map(({val, lbl, cls}) => {
      const active = current === val ? ` ${cls}` : '';
      return `<button class="abtn${active}" data-act="assess"
        data-tid="${esc(teamId)}" data-pos="${esc(pos)}" data-slot="${slot}" data-val="${val}">${lbl}</button>`;
    }).join('');
  }

  return `<div class="assess-row">
    <span class="assess-lbl">Starters</span>
    ${aBtns('starters', posA.starters)}
    ${hasDepth ? `
      <div class="assess-sep"></div>
      <span class="assess-lbl">Depth</span>
      ${aBtns('depth', posA.depth)}
    ` : ''}
  </div>`;
}

function assessmentTags(teamId, pos) {
  const assess = getAssessment(teamId);
  const posA   = assess[pos] || {};
  const tags   = [];
  if (posA.starters) tags.push(`<span class="atag atag-${posA.starters}">${posA.starters==='strength'?'💪':'⚠️'} Starters</span>`);
  if (posA.depth)    tags.push(`<span class="atag atag-${posA.depth}">${posA.depth==='strength'?'💪':'⚠️'} Depth</span>`);
  return tags.join(' ');
}

function positionCard(teamId, pos, canDelete) {
  const players = getRanked(teamId, pos);
  if (!players.length) return '';
  const v = getPosSlots(pos);
  let rows = '';
  players.forEach((pl, i) => {
    if (i === v.s && v.b > 0)                    rows += `<div class="sep"><span class="sep-lbl">Backup</span></div>`;
    if (i === v.s + v.b && i < players.length)   rows += `<div class="sep"><span class="sep-lbl">Deep Bench</span></div>`;
    rows += playerRow(pl, i, players.length, teamId, pos, canDelete);
  });
  const tags = assessmentTags(teamId, pos);
  return `
    <div class="card">
      <div class="card-hd">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span class="pb pb-${pos}">${pos}</span>
          <span style="font-size:12px;color:var(--muted)">${players.length} player${players.length!==1?'s':''}</span>
          ${tags}
        </div>
      </div>
      ${rows}
      ${assessmentRow(teamId, pos)}
    </div>`;
}

function teamPositions(teamId, canDelete) {
  const team = S.teams.find(t => t.id === teamId);
  if (!team) return '';
  const used = POSITIONS.filter(pos => team.players.some(p => p.pos === pos));
  if (!used.length) return `<div class="empty"><div class="empty-ico">📋</div><p>No players yet.</p></div>`;
  return used.map(pos => positionCard(teamId, pos, canDelete)).join('');
}

      <select data-act="gm-team">
        ${others.map(t=>`<option value="${esc(t.id)}"${t.id===cur.id?' selected':''}>${esc(t.name)}</option>`).join('')}

}

function renderTradeFinder() {
  const my     = S.teams.find(t => t.isMyTeam);
  const others = S.teams.filter(t => !t.isMyTeam);
  const cur    = others.find(t => t.id === U.tradeTeam) || others[0];

  if (!my || !cur) return `<div class="page"><div class="empty"><div class="empty-ico">🔄</div>
    <p>Need at least 2 teams. Import a league or add teams in the Import tab.</p>
  </div></div>`;

  const teamSel = others.length > 1 ? `<div class="fg">
    <label>Analyze Trade Partner</label>
    <select data-act="trade-team">
      ${others.map(t=>`<option value="${esc(t.id)}"${t.id===cur.id?' selected':''}>${esc(t.name)}</option>`).join('')}
    </select>
  </div>` : '';

  const {buySignals, chips, hasGMData, hasLiveRanks, myAssess, theirAssess} = analyzeOpportunities(my.id, cur.id);

  // ── Ranking source banner ──
  const rankingSourceBanner = hasLiveRanks
    ? `<div style="background:#0a2010;border:1px solid #22c55e;border-radius:8px;padding:10px 14px;font-size:13px;color:#86efac;margin-bottom:12px">
         🟢 <strong>Live — using ${esc(cur.name)}'s actual self-rankings.</strong>
         Gaps are a genuine difference in how you each value their players.
       </div>`
    : FB_CONNECTED
    ? `<div style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--muted);margin-bottom:12px">
         ⏳ Waiting for <strong>${esc(cur.name)}</strong> to rank their players in the app.
         Once they do, gaps will appear here automatically.
         ${hasGMData ? '<br>Currently showing gaps vs. your GM Board ranking of their players.' : ''}
       </div>`
    : !FB_URL
    ? `<div class="alert alert-info">
         <strong>Connect your league</strong> to see real ranking gaps from all owners.
         Go to <strong>⚙️ Setup</strong> and enter your Firebase database URL.
       </div>`
    : `<div class="alert alert-info">
         <strong>Connecting to league…</strong> Ranking gaps will appear automatically once connected.
       </div>`;

  // ── Context panel (assessments overview) ──
  function assessLine(assess, label) {
    const parts = POSITIONS.map(pos => {
      const pa = assess[pos] || {};
      const bits = [];
      if (pa.starters) bits.push(`<span class="atag atag-${pa.starters}">${pos} ${pa.starters==='strength'?'💪 Str':'⚠️ Need'}</span>`);
      if (pa.depth)    bits.push(`<span class="atag atag-${pa.depth}">${pos} depth ${pa.depth==='strength'?'💪':'⚠️'}</span>`);
      return bits.join('');
    }).filter(Boolean);
    if (!parts.length) return '';
    return `<div class="ctx-row"><span class="ctx-label">${label}</span>${parts.join('')}</div>`;
  }
  const myLine    = assessLine(myAssess,    'My Team');
  const theirLine = assessLine(theirAssess, esc(cur.name));
  const ctxPanel  = (myLine || theirLine) ? `
    <div class="ctx-panel">
      ${myLine}
      ${theirLine}
    </div>` : '';


  // ── Buy signals ──
  function mmTag(tag) {
    return `<span class="mm-tag ${tag.cls}">${tag.text}</span>`;
  }

  const buyRows = buySignals.map(b => {
    const hot = b.gap >= 2;
    const slotTxt = slotInfo(b.myRank, b.pos).text;
    return `<div class="mm-item${hot?' hot':''}">
      <span class="pb pb-${b.pos}">${b.pos}</span>
      <div class="mm-body">
        <div class="mm-name">${esc(b.pl.name)}</div>
        <div class="mm-ranks">
          You rank: <strong>#${b.myRank+1} ${b.pos}</strong> (${slotTxt})
          &nbsp;·&nbsp; Owner appears to rank: <strong>#${b.ownerRank+1}</strong>
        </div>
        ${b.tags.length ? `<div class="mm-tags">${b.tags.map(mmTag).join('')}</div>` : ''}
      </div>
      <div class="mm-gap${b.gap===1?' neutral':''}">+${b.gap}</div>
    </div>`;
  }).join('');

  // ── Trade chips ──
  const chipRows = chips.map(c => {
    return `<div class="mm-item${c.matchesTheirNeed?' chip-match':''}">
      <span class="pb pb-${c.pos}">${c.pos}</span>
      <div class="mm-body">
        <div class="mm-name">${esc(c.pl.name)}</div>
        <div class="mm-ranks">
          Your rank: <strong>#${c.rank+1} ${c.pos}</strong> (${c.si.text})
          ${c.pl.age > 0 ? '&nbsp;·&nbsp; Age '+c.pl.age : ''}
        </div>
        ${c.tags.length ? `<div class="mm-tags">${c.tags.map(mmTag).join('')}</div>` : ''}
      </div>
    </div>`;
  }).join('');

  // ── How-to footer ──
  const howTo = `<div style="background:var(--bg3);border:1px dashed var(--border);border-radius:8px;padding:14px 16px;font-size:13px;color:var(--muted);line-height:1.7;margin-top:8px">
    <strong style="color:var(--text)">How this works</strong><br>
    When everyone in your league connects to the same Firebase database and ranks their own players,
    gaps appear here automatically — <em>no sharing, no importing, no manual steps</em>.
    Each owner's rankings update live the moment they drag a player.<br><br>
    A <strong style="color:var(--gold)">buy signal</strong> means you rank their player higher than they rank themselves — a genuine trade edge.
    A <strong style="color:var(--blue)">trade chip</strong> is where you have depth or they have a tagged need — your leverage.
    Use this to decide <em>who to call</em> and <em>what to lead with</em>.
  </div>`;

  return `<div class="page">
    <div class="page-hd">
      <div>
        <div class="page-title">🔄 Trade Intelligence</div>
        <div class="page-sub">Ranking gaps and roster context — you decide how to use it</div>
      </div>
    </div>
    ${teamSel}
    ${rankingSourceBanner}
    ${ctxPanel}

    <div class="mm-section">
      <div class="mm-section-hd">
        <span class="mm-section-title">🔍 Buy Signals — ${esc(cur.name)} players you value more</span>
        <span class="mm-count">${buySignals.length} found</span>
      </div>
      ${buySignals.length
        ? `<div style="font-size:12px;color:var(--muted);margin-bottom:10px">
             Gap = spots higher you rank them vs. ${hasLiveRanks ? 'their own self-ranking (live)' : 'estimated roster order'}.
           </div>
           ${buyRows}`
        : `<div class="mm-empty">${hasGMData
             ? 'No gaps found — your rankings closely match theirs.'
             : hasLiveRanks ? 'You have not ranked their players in GM Board yet.'
             : 'Rank their players in GM Board, or wait for them to join the app.'}</div>`
      }
    </div>

    <div class="mm-section">
      <div class="mm-section-hd">
        <span class="mm-section-title">📤 Your Trade Chips — What ${esc(cur.name)} might want</span>
        <span class="mm-count">${chips.length} found</span>
      </div>
      ${chips.length
        ? `<div style="font-size:12px;color:var(--muted);margin-bottom:10px">
             Players where you have depth to spare or they have a known need.
             Tag positions in <strong>My Team</strong> and <strong>GM Board</strong> to refine this list.
           </div>
           ${chipRows}`
        : `<div class="mm-empty">Tag your position strengths in <strong>My Team</strong> and their needs in <strong>GM Board</strong> to identify chips.</div>`
      }
    </div>

    ${howTo}
  </div>`;
}

}

// ══════════════════════════════════════════════════

function renderIntel() {
  const noFunctions = false; // now fully client-side

  // Build a name→rank lookup from our own rankings across all positions
  const myRankLookup = {}; // name → { pos, rank }
  const allPlayers = S.teams.flatMap(t => t.players || []);
  Object.entries(S.myRankings || {}).forEach(([pos, ids]) => {
    (ids || []).forEach((id, i) => {
      const p = allPlayers.find(p => p.id === id);
      if (p) myRankLookup[normalizeName(p.name)] = { pos, rank: i + 1, name: p.name };
    });
  });

  // Merge ECR data with my own rankings + projections
  const ecrEntries = Object.values(INTEL.ecr);
  const search = (U.intelSearch || '').toLowerCase().trim();
  const filtered = ecrEntries
    .filter(e => !search || e.name.toLowerCase().includes(search))
    .slice(0, 100);

  // Controls row
  const controls = `
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center">
      <div style="display:flex;gap:0;background:var(--bg3);border:1px solid var(--border);border-radius:6px;overflow:hidden">
        ${['ros','dynasty'].map(t=>`<button class="btn btn-sm${INTEL.intelType===t?' btn-gold':''}" style="border-radius:0;border:none" data-act="intel-type" data-val="${t}">${t==='ros'?'Redraft':'Dynasty'}</button>`).join('')}
      </div>
      <div style="display:flex;gap:0;background:var(--bg3);border:1px solid var(--border);border-radius:6px;overflow:hidden">
        ${['ppr','half-ppr','standard'].map(s=>`<button class="btn btn-sm${INTEL.intelScoring===s?' btn-gold':''}" style="border-radius:0;border:none" data-act="intel-scoring" data-val="${s}">${s==='half-ppr'?'½ PPR':s==='standard'?'Std':s.toUpperCase()}</button>`).join('')}
      </div>
      <select data-act="intel-week" style="background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:13px;font-weight:600">
        ${Array.from({length:18},(_,i)=>`<option value="${i+1}"${INTEL.intelWeek===i+1?' selected':''}>Week ${i+1}</option>`).join('')}
      </select>
      <button class="btn btn-gold btn-sm" data-act="intel-load">🔄 Load Data</button>
    </div>
    <div style="position:relative;margin-bottom:14px">
      <input type="text" id="intel-search" placeholder="Search player…" value="${esc(U.intelSearch||'')}"
        style="width:100%;padding:8px 12px 8px 32px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:13px" />
      <span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)">🔍</span>
    </div>`;

  // Not-hosted banner
  if (noFunctions) {
    return `<div class="page">
      <div class="page-hd"><div><div class="page-title">📊 Player Intel</div>
      <div class="page-sub">Expert consensus, projections, and Vegas lines</div></div></div>
      <div class="alert alert-info">
        <strong>Intel requires the hosted app.</strong><br>
        Data aggregation runs on Netlify servers to bypass CORS restrictions.
        Open <a href="https://gleeful-tulumba-44d1d7.netlify.app" target="_blank" style="color:var(--gold)">gleeful-tulumba-44d1d7.netlify.app</a> to use this feature.
      </div>
    </div>`;
  }

  // Status rows for each data source
  function statusBadge(loaded, loading, error) {
    if (loading) return `<span style="font-size:11px;color:#fcd34d">⟳ Loading…</span>`;
    if (error === 'OFF_SEASON') return `<span style="font-size:11px;color:var(--muted)">Off-season</span>`;
    if (error === 'NO_KEY' || error === 'INVALID_KEY') return `<span style="font-size:11px;color:var(--muted)">No key</span>`;
    if (error) return `<span style="font-size:11px;color:var(--red)" title="${esc(error)}">⚠ Error</span>`;
    if (loaded) return `<span style="font-size:11px;color:#86efac">✓ Loaded</span>`;
    return `<span style="font-size:11px;color:var(--muted)">Not loaded</span>`;
  }

  const oddsKeySetup = `
    <div style="margin-top:10px;padding:12px;background:var(--bg2);border:1px solid var(--border);border-radius:7px;font-size:13px">
      <div style="font-weight:700;margin-bottom:6px;color:var(--text)">🎰 Vegas Odds Setup (optional)</div>
      <p style="color:var(--muted);margin-bottom:8px;line-height:1.5">
        Get a free API key at <strong style="color:var(--text)">the-odds-api.com</strong> (500 req/month free).
        Unlocks NFL player props, futures odds, and ROTY/MVP lines.
      </p>
      <div style="display:flex;gap:8px">
        <input type="text" id="odds-key-input" placeholder="Paste your Odds API key here"
          value="${esc(ODDS_API_KEY)}"
          style="flex:1;font-size:12px;font-family:monospace;background:var(--bg3);border:1px solid var(--border);border-radius:5px;padding:6px 10px;color:var(--text)" />
        <button class="btn btn-gold btn-sm" data-act="save-odds-key">Save Key</button>
        ${ODDS_API_KEY ? `<button class="btn btn-outline btn-sm" data-act="load-odds">Load Odds</button>` : ''}
      </div>
      ${INTEL.oddsError === 'INVALID_KEY' ? `<div style="color:var(--red);font-size:12px;margin-top:6px">⚠ Invalid key — double-check it at the-odds-api.com</div>` : ''}
    </div>`;

  const sourceBar = `
    <div style="padding:12px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;margin-bottom:14px">
      <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-bottom:${!ODDS_API_KEY || INTEL.oddsError === 'INVALID_KEY' ? '0' : '0'}">
        <div style="display:flex;align-items:center;gap:6px">
          <strong>FantasyPros ECR</strong> ${statusBadge(INTEL.ecrLoaded, INTEL.ecrLoading, INTEL.ecrError)}
          ${INTEL.ecrError && INTEL.ecrError !== 'NO_KEY' ? `<span style="font-size:11px;color:var(--muted)" title="${esc(INTEL.ecrError)}">ⓘ</span>` : ''}
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <strong>Sleeper Projections</strong> ${statusBadge(INTEL.projLoaded, INTEL.projLoading, INTEL.projError)}
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <strong>Vegas Odds</strong>
          ${ODDS_API_KEY && !INTEL.oddsError ? statusBadge(INTEL.oddsLoaded, INTEL.oddsLoading, INTEL.oddsError) : `<span style="font-size:11px;color:var(--muted)">No key</span>`}
        </div>
      </div>
      ${(!ODDS_API_KEY || INTEL.oddsError === 'INVALID_KEY') ? oddsKeySetup : ''}
    </div>`;

  // ECR table
  let ecrTable = '';
  if (!INTEL.ecrLoaded && !INTEL.ecrLoading) {
    ecrTable = `<div class="empty" style="padding:32px"><div class="empty-ico">📈</div>
      <p style="color:var(--muted)">Click <strong style="color:var(--text)">Load Data</strong> to fetch FantasyPros Expert Consensus Rankings with uncertainty scores.</p></div>`;
  } else if (INTEL.ecrLoading) {
    ecrTable = `<div class="empty" style="padding:32px"><div class="spin" style="width:28px;height:28px;margin:0 auto 12px"></div><p style="color:var(--muted)">Fetching FantasyPros ECR…</p></div>`;
  } else if (INTEL.ecrError) {
    ecrTable = `<div class="alert alert-error"><strong>ECR Error:</strong> ${esc(INTEL.ecrError)}</div>`;
  } else if (filtered.length) {
    // Identify players where my rank differs significantly from ECR (edge finder)
    const hasMyRankings = Object.values(myRankLookup).length > 0;
    ecrTable = `
      <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead>
          <tr style="border-bottom:1px solid var(--border);text-align:left;background:var(--bg2)">
            <th style="padding:8px 10px;color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;width:42px">ECR</th>
            <th style="padding:8px 10px;color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em">Player</th>
            <th style="padding:8px 10px;color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;width:48px">Pos</th>
            <th style="padding:8px 10px;color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;width:90px" title="Best-case to worst-case expert rank range">Range</th>
            <th style="padding:8px 10px;color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;width:80px" title="Standard deviation of expert ranks — higher = more disagreement = more potential edge">Uncertainty</th>
            ${hasMyRankings ? `<th style="padding:8px 10px;color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;width:70px">My Rank</th>
            <th style="padding:8px 10px;color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;width:60px" title="Your rank vs ECR consensus — positive means you like them more than the experts">Edge</th>` : ''}
            <th style="padding:8px 10px;color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;width:70px">Trending</th>
            <th style="padding:8px 10px;color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;width:70px">Proj</th>
          </tr>
        </thead>
        <tbody>
          ${filtered.map((e, idx) => {
            const myEntry = myRankLookup[normalizeName(e.name)];
            const myRank  = myEntry ? myEntry.rank : null;

            // Edge: how many spots higher/lower you rank them vs ECR
            const edge = (myRank != null && e.fpRank != null)
              ? e.fpRank - myRank   // positive = you like them more than ECR
              : null;

            const proj = (() => {
              if (!INTEL.projLoaded) return '';
              const tp = allPlayers.find(pl => normalizeName(pl.name) === normalizeName(e.name));
              if (tp && INTEL.projections[tp.id]) {
                const pts = INTEL.projections[tp.id].ppr ?? INTEL.projections[tp.id].half_ppr;
                return pts != null ? pts.toFixed(1) : '—';
              }
              return '—';
            })();

            // Uncertainty color: high = opportunity
            const unc = e.uncertainty;
            const uncColor = unc == null ? 'var(--muted)' : unc >= 8 ? '#f87171' : unc >= 4 ? '#fcd34d' : '#86efac';
            const uncLabel = unc == null ? '—' : unc >= 8 ? `🔴 ${unc}` : unc >= 4 ? `🟡 ${unc}` : `🟢 ${unc}`;

            // Edge color
            const edgeColor = edge == null ? 'var(--muted)' : edge > 5 ? '#86efac' : edge < -5 ? '#f87171' : 'var(--text)';
            const edgeLabel = edge == null ? '—' : (edge > 0 ? `+${edge}` : `${edge}`);

            const trendColor = e.addCount > 5000 ? '#86efac' : e.addCount > 1000 ? '#fcd34d' : 'var(--muted)';
            const trendLabel = e.addCount > 0 ? `+${(e.addCount/1000).toFixed(0)}k` : '—';

            const isHighlight = edge != null && edge >= 5;
            const rowBg = isHighlight ? 'background:rgba(34,197,94,.05)' : '';

            return `<tr style="border-bottom:1px solid var(--border);${rowBg}transition:.1s">
              <td style="padding:8px 10px;font-weight:800;color:${e.fpRank<=10?'var(--gold)':'var(--muted)'}">${e.fpRank}</td>
              <td style="padding:8px 10px">
                <div style="font-weight:600;color:var(--text)">${esc(e.name)}${isHighlight?'<span style="margin-left:6px;font-size:10px;background:#14342a;color:#86efac;padding:1px 6px;border-radius:3px;font-weight:700">VALUE</span>':''}</div>
                <div style="font-size:11px;color:var(--muted)">${esc(e.team||'FA')}</div>
              </td>
              <td style="padding:8px 10px"><span class="pb pb-${esc(e.pos||'')}">${esc(e.pos||'')}</span></td>
              <td style="padding:8px 10px;font-size:12px;color:var(--muted)">
                ${e.rankBest!=null && e.rankWorst!=null ? `${e.rankBest}–${e.rankWorst}` : '—'}
              </td>
              <td style="padding:8px 10px;font-weight:700;color:${uncColor}">${uncLabel}</td>
              ${hasMyRankings ? `<td style="padding:8px 10px;font-weight:600">${myRank!=null?`<span style="color:var(--gold)">#${myRank}</span>`:'<span style="color:var(--muted)">—</span>'}</td>
              <td style="padding:8px 10px;font-weight:700;color:${edgeColor}">${edgeLabel}</td>` : ''}
              <td style="padding:8px 10px;font-weight:600;color:${trendColor}">${trendLabel}</td>
              <td style="padding:8px 10px;color:var(--gbright);font-weight:600">${proj || '—'}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      </div>`;
  }

  // Vegas futures table
  let oddsSection = '';
  if (INTEL.oddsLoaded && INTEL.odds.length) {
    const futures = {};
    INTEL.odds.forEach(o => {
      if (!futures[o.market]) futures[o.market] = [];
      // Only add if not already from same bookmaker for this player
      if (!futures[o.market].find(x => x.player === o.player && x.bookmaker === o.bookmaker)) {
        futures[o.market].push(o);
      }
    });
    oddsSection = Object.entries(futures).map(([mkt, rows]) => {
      const label = mkt.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
      const sorted = rows.slice().sort((a,b) => a.price - b.price);
      return `<div class="card" style="margin-top:14px">
        <div class="card-hd"><div class="card-title">🎰 ${esc(label)}</div></div>
        <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">
          <thead><tr style="border-bottom:2px solid var(--border)">
            <th style="padding:6px 10px;color:var(--muted);text-align:left">Player</th>
            <th style="padding:6px 10px;color:var(--muted);text-align:left">Odds</th>
            <th style="padding:6px 10px;color:var(--muted);text-align:left">Book</th>
          </tr></thead>
          <tbody>${sorted.slice(0,15).map(o=>`
            <tr style="border-bottom:1px solid var(--border)">
              <td style="padding:6px 10px;font-weight:600">${esc(o.player)}</td>
              <td style="padding:6px 10px;color:${o.price<0?'#86efac':'#fcd34d'};font-weight:700">${o.price>0?'+':''}${o.price}</td>
              <td style="padding:6px 10px;color:var(--muted)">${esc(o.bookmaker)}</td>
            </tr>`).join('')}
          </tbody>
        </table></div>
      </div>`;
    }).join('');
  } else if (INTEL.oddsLoaded && !INTEL.odds.length) {
    oddsSection = `<div class="alert alert-info" style="margin-top:14px">No Vegas futures data available right now. This is often off-season — try again during the NFL season.</div>`;
  }

  // ── Waiver Wire Intelligence ──────────────────────────
  let waiverSection = '';
  if (INTEL.ecrLoaded && ecrEntries.length) {
    // Build set of player names already rostered in this league
    const rosteredNames = new Set(
      S.teams.flatMap(t => (t.players || []).map(p => normalizeName(p.name)))
    );
    // Find trending players NOT on any roster → available waiver targets
    const available = ecrEntries.filter(e => !rosteredNames.has(normalizeName(e.name)));

    // My team's needs from assessment
    const myTeam = S.teams.find(t => t.isMyTeam);
    const myNeeds = (myTeam && S.myAssessment && S.myAssessment[myTeam.id])
      ? (S.myAssessment[myTeam.id].needs || [])
      : [];

    // Priority: available players whose position matches a team need come first
    const prioritized = [
      ...available.filter(e => myNeeds.includes(e.pos)),
      ...available.filter(e => !myNeeds.includes(e.pos)),
    ];

    if (prioritized.length === 0) {
      waiverSection = `<div class="card" style="margin-top:14px">
        <div class="card-hd"><div class="card-title">🏈 Waiver Wire Intelligence</div></div>
        <div class="empty" style="padding:20px"><div class="empty-ico">✅</div>
          <p>All top trending players are already rostered in your league. Check back after the next news cycle.</p>
        </div>
      </div>`;
    } else {
      const top = prioritized.slice(0, 20);
      waiverSection = `<div class="card" style="margin-top:14px">
        <div class="card-hd">
          <div>
            <div class="card-title">🏈 Waiver Wire Intelligence</div>
            <div style="font-size:12px;color:var(--muted);margin-top:2px">
              Trending players NOT on any roster in your league
              ${myNeeds.length ? `· <span style="color:var(--gold)">⭐ = matches your team need (${myNeeds.join(', ')})</span>` : ''}
            </div>
          </div>
          <div style="font-size:12px;color:var(--muted)">${available.length} available</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px">
          ${top.map(e => {
            const isNeed  = myNeeds.includes(e.pos);
            const projPts = (() => {
              if (!INTEL.projLoaded) return null;
              if (e.pid && INTEL.projections[e.pid]) {
                const pts = INTEL.projections[e.pid].ppr ?? INTEL.projections[e.pid].half_ppr;
                return pts != null ? pts.toFixed(1) : null;
              }
              return null;
            })();
            return `<div style="display:flex;align-items:center;gap:10px;padding:9px 12px;
              background:${isNeed ? '#1a2f1a' : 'var(--bg3)'};
              border:1px solid ${isNeed ? '#22c55e' : 'var(--border)'};border-radius:7px">
              <span class="pb pb-${esc(e.pos||'')}" style="flex-shrink:0">${esc(e.pos||'')}</span>
              <div style="flex:1;min-width:0">
                <div style="font-weight:600;font-size:13px;color:var(--text)">
                  ${isNeed ? '⭐ ' : ''}${esc(e.name)}
                  ${e.team ? `<span style="font-size:11px;color:var(--muted);font-weight:400"> · ${esc(e.team)}</span>` : ''}
                </div>
              </div>
              <div style="text-align:right;flex-shrink:0">
                <div style="font-size:12px;color:#86efac;font-weight:700">+${e.addCount?.toLocaleString()}</div>
                <div style="font-size:10px;color:var(--muted)">adds/24h</div>
              </div>
              ${projPts ? `<div style="text-align:right;flex-shrink:0;min-width:48px">
                <div style="font-size:13px;color:var(--gbright);font-weight:700">${projPts}</div>
                <div style="font-size:10px;color:var(--muted)">proj pts</div>
              </div>` : ''}
            </div>`;
          }).join('')}
        </div>
        ${available.length > 20 ? `<div style="text-align:center;padding:10px 0 2px;font-size:12px;color:var(--muted)">${available.length - 20} more available players not shown</div>` : ''}
      </div>`;
    }
  }

  return `<div class="page">
    <div class="page-hd">
      <div><div class="page-title">📊 Player Intel</div>
      <div class="page-sub">Waiver wire, trending adds, projections &amp; Vegas lines</div></div>
    </div>

    ${controls}
    ${sourceBar}

    ${waiverSection}

    <div class="card" style="margin-top:14px">
      <div class="card-hd">
        <div>
          <div class="card-title">📊 FantasyPros Expert Consensus Rankings</div>
          <div style="font-size:12px;color:var(--muted);margin-top:3px">
            ${INTEL.intelType==='dynasty'?'Dynasty':'Rest-of-Season'} · ${INTEL.intelScoring==='half-ppr'?'Half PPR':INTEL.intelScoring==='standard'?'Standard':'PPR'}
            · Uncertainty = expert disagreement · Edge = your rank vs consensus
          </div>
        </div>
        ${INTEL.ecrLoaded ? `<div style="font-size:12px;color:var(--muted)">${Object.keys(INTEL.ecr).length} players</div>` : ''}
      </div>
      ${ecrTable}
    </div>

    ${oddsSection}
  </div>`;
}

// ══════════════════════════════════════════════════
//  DRAG AND DROP
// ══════════════════════════════════════════════════

let drag = null;

document.addEventListener('dragstart', e => {
  const row = e.target.closest('[data-pr]');
  if (!row) return;
  drag = {key:row.dataset.key, tid:row.dataset.tid, pos:row.dataset.pos, idx:parseInt(row.dataset.idx)};
  setTimeout(() => row.classList.add('dragging'), 0);
});
document.addEventListener('dragover', e => {
  const row = e.target.closest('[data-pr]');
  if (!row || !drag || row.dataset.key !== drag.key) return;
  e.preventDefault();
  document.querySelectorAll('[data-pr].drag-over').forEach(el => el.classList.remove('drag-over'));
  row.classList.add('drag-over');
});
document.addEventListener('dragleave', e => {
  const row = e.target.closest('[data-pr]');
  if (row) row.classList.remove('drag-over');
});
document.addEventListener('drop', e => {
  e.preventDefault();
  const row = e.target.closest('[data-pr]');
  if (!row || !drag || row.dataset.key !== drag.key) { drag=null; return; }
  const toIdx = parseInt(row.dataset.idx);
  if (toIdx !== drag.idx) {
    const arr = getRanked(drag.tid, drag.pos);
    const copy = [...arr];
    const [moved] = copy.splice(drag.idx, 1);
    copy.splice(toIdx, 0, moved);
    saveRanking(drag.tid, drag.pos, copy.map(p => p.id));
  }
  drag = null; render();
});
document.addEventListener('dragend', () => {
  document.querySelectorAll('[data-pr].dragging,[data-pr].drag-over').forEach(el => {
    el.classList.remove('dragging','drag-over');
  });
  drag = null;
});
